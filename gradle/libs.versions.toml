[versions]
kotlin = "2.0.21"
protobuf = "4.28.3"
jsonSchema = "1.5.2"
jackson = "2.18.1"
junit = "5.11.3"
junitPlatform = "1.11.3"
clikt = "5.0.1"
slf4j = "2.0.16"
protobufPlugin = "0.10.0"
grpc = "1.68.1"
tomcatAnnotations = "6.0.53"
postgresql = "42.7.4"
flyway = "10.20.1"
testcontainers = "1.20.4"
paho = "1.2.5"
springBoot = "3.4.0"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
# JsonFormat. 적재 표면이 계약 메시지를 protobuf JSON 규약으로 읽는다 —
# Jackson으로 읽으면 oneof·enum·uint64 표현이 규약과 갈라진다.
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
jsonschema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchema" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# 적재 표면이 Kotlin data class를 본문으로 받는다. 없으면 기본 생성자가 없어
# 500이 나고, 그 500은 배선이 아니라 본문 형식 문제처럼 보인다.
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
tomcat-annotations = { module = "org.apache.tomcat:annotations-api", version.ref = "tomcatAnnotations" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
# 발행자 추상의 실제 구현. §15.30이 "발행자 추상만 두고"라 적어 둔 자리를 채운다.
paho-mqttv5 = { module = "org.eclipse.paho:org.eclipse.paho.mqttv5.client", version.ref = "paho" }
# 브로커를 띄우는 통합 시험용. 기본 스위트는 여전히 in-process다(§12.1).
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
