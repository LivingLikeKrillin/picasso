syntax = "proto3";

package picasso.v1;

option java_multiple_files = true;
option java_package = "dev.picasso.contracts.v1";

import "google/protobuf/descriptor.proto";

// 이 파라미터가 몇 번째 minor부터 존재하는가. 설계 §5.2.
// 주석이 아니라 옵션으로 두는 이유는 디스크립터에 남아야 게이트가 읽기 때문이다.
extend google.protobuf.FieldOptions {
  uint32 since_minor = 50001;

  // 이 파라미터가 선택인가. 설계 §8.3의 skill_type_param.optional로 동기화된다.
  // since_minor > 0으로 유도할 수 없다 — 처음부터 선택인 파라미터가 있다.
  bool is_optional = 50005;
}

// 이 메시지가 어느 스킬 타입의 major 몇인가.
extend google.protobuf.MessageOptions {
  string skill_type_name = 50002;
  uint32 skill_type_major = 50003;

  // 이 major가 아는 최신 minor. 설계 §8.3의 skill_type.max_minor로 동기화된다.
  // max(since_minor)로 유도하지 않는다 — 파라미터를 더하지 않는 minor 증가
  // (예: 성공 판정 문구만 다듬은 1.3)를 표현할 수 없기 때문이다.
  uint32 skill_type_max_minor = 50004;
}

// ---------------------------------------------------------------------------
// 스킬 타입 카탈로그.
//
// 규칙 셋 (설계 §5.2):
//   - 스킬 타입 하나의 major 하나가 메시지 하나다. major가 오르면 새 메시지다.
//   - 파라미터 키는 불변이다. 의미나 단위가 바뀌면 새 키를 만들고 옛 키를 폐기한다.
//   - 선택 파라미터를 더하는 것은 minor 증가다. since_minor로 표시한다.
//
// 1단계는 어휘를 늘리는 일이 아니었다(설계 §1.3의 A-5는 비목표). 아래 셋은
// 게이트와 픽스처가 판정 대상으로 삼을 최소한이었다.
//
// **넷째는 실물이 데려왔다.** Unitree G1의 어댑터를 설계하면서 벤더의 `sport`
// 서비스와 위 셋을 대조했더니 **하나도 맞지 않았다** — `navigate_to`는 지도를
// 요구하는데 SDK가 주는 것은 `SetVelocity(vx, vy, omega, duration)`이고,
// `pick_place`와 `inspect`는 대상 시맨틱을 요구하는데 그 자리가 아예 없다.
// §15.7이 *"`mimic`이 계약을 정의해버릴 위험"*이라 적어 둔 것의 관측이다.
//
// `move_relative`가 그 대조의 결과이며 **G1 전용이 아니다** — 속도와 지속시간은
// Spot·Digit·AMR이 모두 갖는 이동 원시다. 벤더 중립을 지키면서 실물이 실제로
// 답할 수 있는 첫 스킬이라서 이것을 골랐다. 기종 하나를 위해 어휘를 늘리는
// 것이었다면 골라서는 안 됐다.
//
// proto 타입 → 설계 §4.3의 ValueType 매핑. ContractIndex가 이 표대로 옮긴다.
//   bool   → VALUE_TYPE_BOOL
//   int64  → VALUE_TYPE_INTEGER
//   double → VALUE_TYPE_NUMBER
//   string → VALUE_TYPE_STRING
//   enum   → VALUE_TYPE_ENUM   (허용 값은 프로파일이 정한다. 계약은 열거 자체를
//                               카탈로그에 두지 않는다 — 값 집합이 기종마다 다르다)
// 그 밖의 타입은 카탈로그에 쓰지 않는다. 게이트 검사 4번이 미지 타입을 만나면 실패한다.
// ---------------------------------------------------------------------------

// 대상을 집어 지정한 곳에 놓는다.
// 성공 판정: 대상이 목표 위치에 놓이고 그리퍼가 떨어졌을 때.
message PickPlaceV1 {
  option (skill_type_name) = "pick_place";
  option (skill_type_major) = 1;
  option (skill_type_max_minor) = 2;

  // 집을 대상의 식별자.
  string object_id = 1 [(since_minor) = 0, (is_optional) = false];

  // 놓을 위치의 시맨틱 ID.
  string destination = 2 [(since_minor) = 0, (is_optional) = false];

  // 처음부터 선택이었던 파라미터. since_minor > 0으로 optional을 유도할 수 없다는
  // 것을 이 필드가 보여 준다.
  bool verify_grasp = 3 [(since_minor) = 0, (is_optional) = true];

  // 파지력. 뉴턴. minor 2에서 추가된 선택 파라미터다.
  double grip_force = 4 [(since_minor) = 2, (is_optional) = true];

  // 재시도 횟수 상한을 로봇에게 힌트로 준다. 정책이 아니라 힌트다.
  int64 grasp_attempts = 5 [(since_minor) = 2, (is_optional) = true];
}

// 지정한 시맨틱 위치로 이동한다.
// 성공 판정: 접근점에 도착하고 정지했을 때. 자세 정밀도는 이 스킬의 책임이 아니다.
message NavigateToV1 {
  option (skill_type_name) = "navigate_to";
  option (skill_type_major) = 1;
  option (skill_type_max_minor) = 0;

  // 목적지의 시맨틱 위치 ID. 좌표가 아니다 — 설계노트 §4.3.
  string location = 1 [(since_minor) = 0, (is_optional) = false];
}

// 대상을 살펴 상태를 보고한다.
// 성공 판정: 지정한 대상의 관측을 마치고 결과를 실었을 때.
message InspectV1 {
  option (skill_type_name) = "inspect";
  option (skill_type_major) = 1;
  option (skill_type_max_minor) = 3;

  // 살펴볼 대상의 시맨틱 ID.
  string target = 1 [(since_minor) = 0, (is_optional) = false];

  // minor 3에서 추가된 선택 파라미터.
  //
  // **열거의 값 집합은 계약이 정하지 않는다** — 기종마다 다르다(파일 상단의
  // 매핑 표). 여기 있는 것은 타입 자리이며 허용 값은 프로파일의
  // `allowed_values`가 선언하고 §10.4 ③이 그것을 집행한다.
  InspectMode mode = 2 [(since_minor) = 3, (is_optional) = true];
}

// 위 주석대로, 계약은 자리만 만들고 값 집합은 프로파일이 정한다.
enum InspectMode {
  INSPECT_MODE_UNSPECIFIED = 0;
}

// 지시한 속도로 지시한 시간 동안 움직인다.
// 성공 판정: 지시한 시간이 지나고 정지했을 때.
//
// **도달 위치를 보장하지 않는다.** `navigate_to`와 갈리는 지점이 그것이며,
// 둘을 한 스킬로 접으면 안 되는 이유이기도 하다 — 이쪽은 지도가 없어도 되고
// 저쪽은 지도가 있어야 한다. 소비자가 어느 쪽을 받았는지로 자기가 위치를
// 믿어도 되는지가 갈린다.
//
// 속도의 상한은 계약이 정하지 않는다. 기종마다 다르므로 프로파일의
// `min_value`·`max_value`가 정하고, **벤더가 그 값을 선언하지 않으면 프로파일도
// 비운다**(§15.7의 파생 규율).
message MoveRelativeV1 {
  option (skill_type_name) = "move_relative";
  option (skill_type_major) = 1;
  option (skill_type_max_minor) = 0;

  // 전진 속도. m/s. 음수는 후진이다.
  double forward_speed = 1 [(since_minor) = 0, (is_optional) = false];

  // 횡이동 속도. m/s. 횡이동을 못 하는 기종은 이 스킬을 선언하지 않거나
  // 프로파일이 범위를 0으로 좁힌다.
  double lateral_speed = 2 [(since_minor) = 0, (is_optional) = false];

  // 선회 각속도. rad/s.
  double yaw_rate = 3 [(since_minor) = 0, (is_optional) = false];

  // 지속시간. 초. **필수다** — 기본값을 계약이 정하면 그 값이 기종마다
  // 다른 안전 여유를 덮는다.
  double duration = 4 [(since_minor) = 0, (is_optional) = false];
}
