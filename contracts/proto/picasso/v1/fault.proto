syntax = "proto3";

package picasso.v1;

option java_multiple_files = true;
option java_package = "dev.picasso.contracts.v1";

import "picasso/v1/common.proto";

// 정준 실패 분류 — 미들웨어 중앙 설계 §1.4 의 열다섯(2026-09-09 결정, 그대로).
//
// `error_type` 이 실패 **모드**의 이름(프로파일이 선언하고, 수명과 두 불리언을
// 가지며, 벤더 확장 `X_` 이름공간이 있는 것)이라면, 이것은 그 실패가 **상류의
// 판단에 무슨 뜻인가**의 분류다. 상류·실행 층(`picasso` 모듈)은 이것으로만
// 분기한다. 벤더 코드에서 여기로 옮기는 것은 **어댑터**(기종을 아는 유일한 자리,
// ADR 33)이고, 벤더 원문은 `Fault.vendor_detail` 에 동반한다 — 로그·사후
// 분석용이지 분기의 입력이 아니다(보고서 16장 — 하류 상태 이름은 감춘다).
//
// 셋(`LOCALIZATION_LOST`·`PAYLOAD_LOST`·`CONTROL_AUTHORITY_LOST`)이 `error_type`
// 코어와 이름이 같다 — 같은 뜻이라 같은 이름이며, 미믹은 그 모드에서 이 분류를
// 유도한다. 나머지 모드(`SKILL_EXECUTION_FAILED` 같은 것)는 프로파일이
// `failure_class` 를 따로 선언하지 않으면 `UNCLASSIFIED` 다.
//
// ADR 9(발신자 없는 선언 금지): 발신자 = 어댑터 셋(Spot 항법 피드백·행동 결함,
// Digit 액션 종류, G1 에러 코드)과 미믹(프로파일 모드) · 소비자 = `picasso`
// 미들웨어의 실행 단위(`ExecutionUnit.failureClass`).
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  // 대상을 못 찾음·못 봄
  FAILURE_CLASS_PERCEPTION_FAILED = 1;
  // 잡을 방법이 없음 — 재시도해도 소용없고 대상을 바꿔야 한다
  FAILURE_CLASS_GRASP_PLANNING_FAILED = 2;
  FAILURE_CLASS_GRASP_FAILED = 3;
  FAILURE_CLASS_PLACE_FAILED = 4;
  // 들고 있던 것을 놓침
  FAILURE_CLASS_PAYLOAD_LOST = 5;
  // 갈 길이 막힘
  FAILURE_CLASS_ROUTE_BLOCKED = 6;
  // 갈 길이 없음
  FAILURE_CLASS_NO_ROUTE = 7;
  FAILURE_CLASS_LOCALIZATION_LOST = 8;
  FAILURE_CLASS_CONTROL_AUTHORITY_LOST = 9;
  FAILURE_CLASS_COMMAND_TIMED_OUT = 10;
  // 다른 명령이 덮음
  FAILURE_CLASS_COMMAND_OVERRIDDEN = 11;
  FAILURE_CLASS_HARDWARE_FAULT = 12;
  FAILURE_CLASS_ROBOT_FELL = 13;
  // 시작 조건 미충족 — FSM·초기화·권한
  FAILURE_CLASS_PRECONDITION_FAILED = 14;
  // 벤더가 분류 불가한 정보만 줌. 어댑터가 지어내지 않았다는 뜻이다
  FAILURE_CLASS_UNCLASSIFIED = 15;
}

// 설계 §4.6.
// 설계노트 A-4는 재시도가능/이관가능/사람개입 3분류를 계약에 담자고 했으나
// 이 계약은 3분류를 담지 않는다. 3분류는 처방이고 처방은 판단이며,
// "이관 가능한가"를 어댑터가 답하려면 벤더가 우리 운영 정책을 알아야 한다.
// 대신 "남은 능력"을 두 불리언으로 묻는다 — 어댑터가 기계적으로 채울 수 있고
// 3분류는 미션 계층이 여기서 파생시킨다.
message Fault {
  // 설계 §4.3의 명명 규칙. SCREAMING_SNAKE_CASE이며 코어 값은 계약이 소유한다.
  // 코어 여덟:
  //   LOCALIZATION_LOST · PAYLOAD_LOST · SKILL_EXECUTION_FAILED
  //   PARAMETER_OUT_OF_RANGE · CONTRACT_REVISION_MISMATCH · INTERNAL_ERROR
  //   TERMINAL_STATE_VIOLATED  — 종착 뒤에 로봇이 다시 움직였다(§4.4 래치 불변식)
  //   CONTROL_AUTHORITY_LOST   — 제어 권한을 빼앗겼다(§4.9)
  // 벤더 확장은 X_<VENDOR>_ 접두사를 쓴다.
  // 뒤의 둘은 프로파일이 선언하는 실패 모드가 아니라 어댑터가 런타임에
  // 발행하는 것이므로 프로파일에 쓰면 안 된다 — 게이트 검사 3번이 막는다.
  string error_type = 1;

  // 이 결함을 안고 현재 태스크를 계속할 수 있는가.
  bool can_continue_current_task = 2;

  // 이 결함을 안고 새 태스크를 받을 수 있는가.
  bool can_accept_new_task = 3;

  // 스킬 수준 결함이면 references에 skill_id가 들어간다.
  // "이동은 되는데 조작만 안 되는" 상태가 이렇게 표현된다.
  repeated Reference references = 4;

  // 사람이 취할 조치. 사람 개입 등급을 실무에서 쓸모 있게 만드는 필드다.
  string error_hint = 5;

  Lifetime active_until = 6;

  // 정준 실패 분류(위). 종착이 실패인 태스크의 `WatchTaskResponse.fault` 는
  // 이것을 든다 — 상류는 이것으로 분기한다.
  FailureClass failure_class = 7;

  // 벤더 원문 — 코드·메시지·상태 이름. 진단에 동반할 뿐 분기의 입력이 아니다.
  // 비어 있을 수 있다(미믹의 코어 모드처럼 벤더가 없는 경우).
  string vendor_detail = 8;
}
