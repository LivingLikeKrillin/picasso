<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="624" viewBox="0 0 1000 624" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <rect x="6" y="6" width="988" height="612" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="46" font-size="18" font-weight="600" fill="#1f2328">경계는 두 곳뿐이다</text>
  <text x="32" y="72" font-size="12.5" fill="#57606a">가운데만 우리가 정한다. 위아래는 구현하지 않은 것이 아니라, 무엇이 와도 상관없게 만든 것이다.</text>
  <text x="32" y="93" font-size="12.5" fill="#57606a">여기 적은 이름들은 예시다 — 경계가 둘이라는 것이 주장이고, 목록이 주장이 아니다.</text>
  <rect x="24" y="118" width="952" height="100" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="40" y="142" font-size="11" font-weight="700" letter-spacing="1" fill="#8b95a1">① 상위 시스템 — 무엇이 와도 된다</text>
  <rect x="40" y="158" width="47.8" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="63.9" y="179" font-size="11.5" text-anchor="middle" fill="#1f2328">MES</text>
  <rect x="97.8" y="158" width="87.4" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="141.5" y="179" font-size="11.5" text-anchor="middle" fill="#1f2328">WMS / WCS</text>
  <rect x="195.2" y="158" width="61" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="225.7" y="179" font-size="11.5" text-anchor="middle" fill="#1f2328">SCADA</text>
  <rect x="266.2" y="158" width="47.8" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="290.09999999999997" y="179" font-size="11.5" text-anchor="middle" fill="#1f2328">ERP</text>
  <rect x="324" y="158" width="94.6" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="371.3" y="179" font-size="11.5" text-anchor="middle" fill="#1f2328">라인 제어기</text>
  <rect x="428.6" y="158" width="131.8" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="494.5" y="179" font-size="11.5" text-anchor="middle" fill="#1f2328">…그 밖의 무엇이든</text>
  <text x="40" y="244" font-size="11" font-weight="600" fill="#0969da">경계 ①  요구를 제시하고 협상하는 소비자. consumer.kind 는 CLIENT | UPSTREAM_SYSTEM 둘뿐이다</text>
  <rect x="24" y="260" width="952" height="104" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="40" y="284" font-size="11" font-weight="700" letter-spacing="1" fill="#0969da">② 계약과 레지스트리 — 여기만 고정이다</text>
  <rect x="40" y="298" width="454" height="50" rx="4" fill="#ffffff" stroke="#0969da"/>
  <text x="267" y="319" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">계약 · proto</text>
  <text x="267" y="337" font-size="10.5" text-anchor="middle" fill="#57606a">스킬 · 상태 · 헤더. 되돌릴 수 없는 유일한 축이다</text>
  <rect x="506" y="298" width="454" height="50" rx="4" fill="#ffffff" stroke="#0969da"/>
  <text x="733" y="319" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2328">레지스트리</text>
  <text x="733" y="337" font-size="10.5" text-anchor="middle" fill="#57606a">기종 프로파일 · 어댑터 바인딩 · 소비자 원장</text>
  <text x="40" y="390" font-size="11" font-weight="600" fill="#0969da">경계 ②  프로파일을 선언하고 계약을 이행하는 어댑터. 벤더 통신과 벤더 코드는 전부 이 안에서만 산다</text>
  <rect x="24" y="406" width="952" height="118" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="40" y="430" font-size="11" font-weight="700" letter-spacing="1" fill="#8b95a1">③ 기체와 설비 — 무엇이 와도 된다</text>
  <rect x="40" y="444" width="146.66666666666666" height="62" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="113.33333333333333" y="461" font-size="10" text-anchor="middle" fill="#8b95a1">Unitree</text>
  <text x="113.33333333333333" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">G1</text>
  <text x="113.33333333333333" y="495" font-size="9.5" text-anchor="middle" fill="#57606a">휴머노이드 · DDS</text>
  <rect x="194.66666666666666" y="444" width="146.66666666666666" height="62" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="268" y="461" font-size="10" text-anchor="middle" fill="#8b95a1">Boston Dynamics</text>
  <text x="268" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Spot</text>
  <text x="268" y="495" font-size="9.5" text-anchor="middle" fill="#57606a">4족보행 · gRPC</text>
  <rect x="349.3333333333333" y="444" width="146.66666666666666" height="62" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="422.66666666666663" y="461" font-size="10" text-anchor="middle" fill="#8b95a1">Agility Robotics</text>
  <text x="422.66666666666663" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Digit</text>
  <text x="422.66666666666663" y="495" font-size="9.5" text-anchor="middle" fill="#57606a">휴머노이드 · WebSocket</text>
  <rect x="504" y="444" width="146.66666666666666" height="62" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="577.3333333333334" y="461" font-size="10" text-anchor="middle" fill="#8b95a1">Boston Dynamics</text>
  <text x="577.3333333333334" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Orbit</text>
  <text x="577.3333333333334" y="495" font-size="9.5" text-anchor="middle" fill="#57606a">플릿 관리자 · HTTP</text>
  <rect x="658.6666666666666" y="444" width="146.66666666666666" height="62" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="732" y="461" font-size="10" text-anchor="middle" fill="#8b95a1">산업 설비</text>
  <text x="732" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Modbus / TCP</text>
  <text x="732" y="495" font-size="9.5" text-anchor="middle" fill="#57606a">설비 신호</text>
  <rect x="813.3333333333333" y="444" width="146.66666666666666" height="62" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="886.6666666666666" y="461" font-size="10" text-anchor="middle" fill="#8b95a1">MiMic</text>
  <text x="886.6666666666666" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">에뮬레이터</text>
  <text x="886.6666666666666" y="495" font-size="9.5" text-anchor="middle" fill="#57606a">실물이 아니어도 된다</text>
  <rect x="24" y="546" width="952" height="56" rx="6" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="44" y="569" font-size="11" fill="#57606a">③ 에 무엇을 더해도 ② 는 안 바뀐다 — 새 기종은 프로파일 한 장과 그 기종만 아는 어댑터 모듈 하나다.</text>
  <text x="44" y="588" font-size="11" fill="#57606a">게이트 검사 7번이 공용 여덟 모듈의 소스를 훑어 기종 이름이 ② 로 올라오는 것을 CI 실패 조건으로 막는다.</text>
</svg>
