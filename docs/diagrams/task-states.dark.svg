<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/></marker>
  </defs>
  <rect x="6" y="6" width="988" height="708" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="46" font-size="18" font-weight="600" fill="#c9d1d9">종착은 래치된다</text>
  <text x="32" y="72" font-size="12.5" fill="#8b949e">종착에 든 태스크는 어떤 이유로도 비종착으로 돌아오지 않는다. 그래서 오른쪽에서 왼쪽으로 가는 선이 없다.</text>
  <text x="32" y="93" font-size="12.5" fill="#8b949e">지대를 건너는 선은 로봇에서 올라오는 사건이고, 라벨은 그 사건이 무엇이었는지다.</text>
  <text x="32" y="114" font-size="12.5" fill="#8b949e">상위가 부르는 명령(StartTask · PauseTask · RetryTask · CancelTask)은 왼쪽 지대 안에서만 움직인다.</text>
  <rect x="24" y="150" width="416" height="448" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="40" y="174" font-size="11" font-weight="700" letter-spacing="1" fill="#8b949e">비종착 여섯 — 되돌아가는 화살표는 이 안에만 있다</text>
  <rect x="592" y="150" width="384" height="448" rx="10" fill="#0f2f1a" stroke="#3fb950"/>
  <text x="608" y="174" font-size="11" font-weight="700" letter-spacing="1" fill="#3fb950">종착 넷 — 나가는 화살표가 없다</text>
  <rect x="40" y="194" width="384" height="52" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="56" y="216" font-size="12.5" font-weight="600" fill="#c9d1d9">ACCEPTED</text>
  <text x="56" y="234" font-size="10.5" fill="#8b949e">접수됐고 아직 시작 전</text>
  <rect x="40" y="262" width="384" height="52" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="56" y="284" font-size="12.5" font-weight="600" fill="#c9d1d9">RUNNING</text>
  <text x="56" y="302" font-size="10.5" fill="#8b949e">스킬이 돌고 있다</text>
  <rect x="40" y="330" width="384" height="52" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="56" y="352" font-size="12.5" font-weight="600" fill="#c9d1d9">PAUSED</text>
  <text x="56" y="370" font-size="10.5" fill="#8b949e">PauseTask 로 멈춰 있다</text>
  <rect x="40" y="398" width="384" height="52" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="56" y="420" font-size="12.5" font-weight="600" fill="#c9d1d9">RETRIABLE</text>
  <text x="56" y="438" font-size="10.5" fill="#8b949e">로봇 혼자 다시 하면 된다</text>
  <rect x="40" y="466" width="384" height="52" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="56" y="488" font-size="12.5" font-weight="600" fill="#c9d1d9">NEEDS_INTERVENTION</text>
  <text x="56" y="506" font-size="10.5" fill="#8b949e">사람이 무언가 해야 한다</text>
  <rect x="40" y="534" width="384" height="52" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="56" y="556" font-size="12.5" font-weight="600" fill="#c9d1d9">CANCELLING</text>
  <text x="56" y="574" font-size="10.5" fill="#8b949e">취소는 즉시가 아니라 되돌리는 구간이다</text>
  <rect x="608" y="228" width="352" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="624" y="250" font-size="12" font-weight="600" fill="#c9d1d9">SUCCEEDED</text>
  <text x="624" y="268" font-size="10.5" fill="#8b949e">스킬이 완료했다</text>
  <rect x="608" y="296" width="352" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="624" y="318" font-size="12" font-weight="600" fill="#c9d1d9">FAILED</text>
  <text x="624" y="336" font-size="10.5" fill="#8b949e">재시도해도 같은 결과다</text>
  <rect x="608" y="364" width="352" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="624" y="386" font-size="12" font-weight="600" fill="#c9d1d9">CANCELLED</text>
  <text x="624" y="404" font-size="10.5" fill="#8b949e">되돌리기까지 마쳤다</text>
  <rect x="608" y="432" width="352" height="52" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="624" y="454" font-size="12" font-weight="600" fill="#c9d1d9">CANCELLED_RECOVERY_FAILED</text>
  <text x="624" y="472" font-size="10.5" fill="#8b949e">물건을 든 채 멈춰 있다</text>
  <polyline points="424,288 516,288 516,254 608,254" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#am)"/>
  <rect x="487.25" y="245" width="57.5" height="16" rx="3" fill="#0d1117"/>
  <text x="516" y="257" font-size="10" text-anchor="middle" fill="#8b949e">스킬 완료</text>
  <polyline points="424,288 516,288 516,322 608,322" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#am)"/>
  <rect x="456" y="313" width="120" height="16" rx="3" fill="#0d1117"/>
  <text x="516" y="325" font-size="10" text-anchor="middle" fill="#8b949e">스킬 Halt · TERMINAL</text>
  <polyline points="424,560 516,560 516,390 608,390" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#am)"/>
  <rect x="487.25" y="381" width="57.5" height="16" rx="3" fill="#0d1117"/>
  <text x="516" y="393" font-size="10" text-anchor="middle" fill="#8b949e">복구 완료</text>
  <polyline points="424,560 516,560 516,458 608,458" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#am)"/>
  <rect x="478.5" y="449" width="75" height="16" rx="3" fill="#0d1117"/>
  <text x="516" y="461" font-size="10" text-anchor="middle" fill="#8b949e">복구 중 Halt</text>
  <rect x="24" y="618" width="952" height="78" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="44" y="641" font-size="11" fill="#8b949e">RetryTask 는 RETRIABLE · NEEDS_INTERVENTION 의 탈출구 하나뿐이다. 그 밖의 상태에서 부르면 INVALID_TRANSITION 이다.</text>
  <text x="44" y="660" font-size="11" fill="#8b949e">CancelTask 는 비종착 여섯 어디서나 합법이다 — 취소가 CANCELLING 을 지나는 것은 되돌릴 것이 남아 있기 때문이다.</text>
  <text x="44" y="679" font-size="11" fill="#d29922">CANCELLED_RECOVERY_FAILED 가 종착인 것이 요점이다. 되돌리기에 실패해도 태스크는 끝난 것이고, 남은 것은 사람의 일이다.</text>
</svg>
