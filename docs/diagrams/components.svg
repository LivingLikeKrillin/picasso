<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="876" viewBox="0 0 1000 876" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="am" markerWidth="8" markerHeight="8" refX="6.5" refY="2.75" orient="auto"><path d="M0,0 L6.5,2.75 L0,5.5 Z" fill="#57606a"/></marker>
  </defs>
  <!-- edge: adapter-agility-digit -> adapter-core -->
  <!-- edge: adapter-boston-dynamics-orbit -> adapter-core -->
  <!-- edge: adapter-boston-dynamics-orbit -> adapter-host -->
  <!-- edge: adapter-boston-dynamics-orbit -> uplink -->
  <!-- edge: adapter-boston-dynamics-spot -> adapter-core -->
  <!-- edge: adapter-host -> adapter-core -->
  <!-- edge: adapter-host -> capability -->
  <!-- edge: adapter-host -> uplink -->
  <!-- edge: adapter-unitree-g1 -> adapter-core -->
  <!-- edge: harness -> client -->
  <!-- edge: harness -> mimic -->
  <!-- edge: harness -> uplink -->
  <!-- edge: mimic -> capability -->
  <!-- edge: mimic -> uplink -->
  <!-- edge: picasso -> capability -->
  <!-- edge: picasso -> client -->
  <!-- edge: registry -> gate -->
  <rect x="6" y="6" width="988" height="864" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="46" font-size="18" font-weight="600" fill="#1f2328">모듈 아키텍처 및 의존성 토폴로지 (Dependency Topology)</text>
  <text x="32" y="72" font-size="12.5" fill="#57606a">모듈 16 개 구성: 코어 계약 계층(2개)은 내부 의존성이 전혀 없으며, 상위/하위 14개 모듈이 해당 계약에 의존</text>
  <text x="32" y="93" font-size="12.5" fill="#57606a">가상화 에뮬레이터(mimic)와 물리 런타임(adapter-host)이 대등한 위치를 점하며, 기종별 코드는 어댑터 모듈 내부에만 격리</text>
  <rect x="24" y="130" width="952" height="84" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="40" y="152" font-size="10.5" font-weight="700" letter-spacing="1" fill="#8b95a1">소비자 계층 (Consumers: 계약 소비 및 오케스트레이션)</text>
  <rect x="40" y="162" width="452" height="38" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="54" y="180" font-size="12.5" font-weight="600" fill="#1f2328">picasso</text>
  <text x="54" y="194" font-size="9.5" fill="#57606a">미들웨어 코어: 접수·협상·오케스트레이션·원격측정 수집 (기종 비종속)</text>
  <rect x="508" y="162" width="452" height="38" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="522" y="180" font-size="12.5" font-weight="600" fill="#1f2328">client</text>
  <text x="522" y="194" font-size="9.5" fill="#57606a">계약 적합성 및 완료 기준 검증용 표준 참조 클라이언트</text>
  <polyline points="492,181 506,181" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#am)"/>
  <rect x="24" y="254" width="952" height="104" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="42" y="279" font-size="11" font-weight="700" letter-spacing="1" fill="#0969da">코어 계약 계층 (Contracts &amp; Semantic Vocabulary — 내부 의존성 0)</text>
  <rect x="42" y="290" width="450" height="52" rx="4" fill="#ffffff" stroke="#0969da"/>
  <text x="58" y="313" font-size="14.5" font-weight="600" fill="#1f2328">contracts</text>
  <text x="58" y="331" font-size="10" fill="#57606a">Protobuf gRPC 스키마: 스킬·수명주기·원격측정·결함</text>
  <text x="476" y="313" font-size="12" font-weight="600" text-anchor="end" fill="#0969da">13개 모듈 참조</text>
  <rect x="508" y="290" width="450" height="52" rx="4" fill="#ffffff" stroke="#0969da"/>
  <text x="524" y="313" font-size="14.5" font-weight="600" fill="#1f2328">profile-model</text>
  <text x="524" y="331" font-size="10" fill="#57606a">기체 프로파일 불변 데이터 모델 및 직렬화</text>
  <text x="942" y="313" font-size="12" font-weight="600" text-anchor="end" fill="#0969da">7개 모듈 참조</text>
  <text x="500" y="240" font-size="10.5" text-anchor="middle" fill="#0969da">↑ 상위 소비자 모듈이 코어 계약 참조</text>
  <text x="500" y="380" font-size="10.5" text-anchor="middle" fill="#0969da">↓ 하위 12개 모듈 전체가 코어 계약 참조 — 다이어그램 가독성을 위해 직결 화살표 20 개는 안 그렸다</text>
  <rect x="24" y="398" width="952" height="272" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="40" y="420" font-size="10.5" font-weight="700" letter-spacing="1" fill="#8b95a1">발신자 및 실행 계층 (Senders &amp; Execution: 계약 구현체)</text>
  <rect x="40" y="430" width="920" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="54" y="448" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b95a1">공용 모듈</text>
  <text x="54" y="464" font-size="9.5" fill="#8b95a1">공통 참조</text>
  <text x="160" y="450" font-size="12" font-weight="600" fill="#1f2328">capability</text>
  <text x="160" y="465" font-size="9.5" fill="#57606a">프로파일 → Capability 투영 및 기능 협상 엔진 (전송 계층 독립)</text>
  <text x="553" y="450" font-size="12" font-weight="600" fill="#1f2328">uplink</text>
  <text x="553" y="465" font-size="9.5" fill="#57606a">원격 측정 브로커 전송 및 레지스트리 상태 보고</text>
  <rect x="40" y="490" width="430" height="162" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="255" y="517" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">mimic</text>
  <text x="255" y="535" font-size="10.5" text-anchor="middle" fill="#57606a">프로파일 주도 가상화 에뮬레이터</text>
  <text x="255" y="551" font-size="10" text-anchor="middle" fill="#57606a">물리 로봇 및 어댑터 대체 (고충실도 시뮬레이션)</text>
  <rect x="64" y="566" width="382" height="66" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="255" y="590" font-size="12" font-weight="600" text-anchor="middle" fill="#8b95a1">단일 프로파일 기반</text>
  <text x="255" y="608" font-size="9.5" text-anchor="middle" fill="#8b95a1">기체 특성 완전 규격화</text>
  <text x="255" y="623" font-size="9.5" text-anchor="middle" fill="#8b95a1">물리 하드웨어 비종속성</text>
  <rect x="530" y="490" width="430" height="162" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="745" y="517" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">adapter-host</text>
  <text x="745" y="535" font-size="10" text-anchor="middle" fill="#57606a">단일 어댑터를 표준 gRPC 서비스로 호스팅 (기종 비종속 런타임)</text>
  <rect x="546" y="546" width="398" height="58" rx="5" fill="#eaf3ea" stroke="#1a7f37"/>
  <text x="745" y="563" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1a7f37">기종별 벤더 어댑터 (4종) — 기종 전용 의존성 격리 영역</text>
  <rect x="554" y="572" width="92.5" height="22" rx="3" fill="#ffffff" stroke="#1a7f37"/>
  <text x="600.25" y="587" font-size="9.5" text-anchor="middle" fill="#1a7f37">unitree-g1</text>
  <rect x="650.5" y="572" width="92.5" height="22" rx="3" fill="#ffffff" stroke="#1a7f37"/>
  <text x="696.75" y="587" font-size="9.5" text-anchor="middle" fill="#1a7f37">spot</text>
  <rect x="747" y="572" width="92.5" height="22" rx="3" fill="#ffffff" stroke="#1a7f37"/>
  <text x="793.25" y="587" font-size="9.5" text-anchor="middle" fill="#1a7f37">agility-digit</text>
  <rect x="843.5" y="572" width="92.5" height="22" rx="3" fill="#ffffff" stroke="#1a7f37"/>
  <text x="889.75" y="587" font-size="9.5" text-anchor="middle" fill="#1a7f37">orbit</text>
  <rect x="546" y="610" width="398" height="28" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="745" y="628" font-size="9.5" text-anchor="middle" fill="#57606a">adapter-core — 공통 RobotAdapter 추상 계약 (기종 비종속)</text>
  <polyline points="474,500 526,500" fill="none" stroke="#cfe0f5" stroke-width="1.5"/>
  <polyline points="474,642 526,642" fill="none" stroke="#cfe0f5" stroke-width="1.5"/>
  <text x="500" y="566" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0969da">대등한</text>
  <text x="500" y="581" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0969da">위상</text>
  <rect x="24" y="690" width="468" height="88" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="40" y="712" font-size="10.5" font-weight="700" letter-spacing="1" fill="#8b95a1">테스트 하네스</text>
  <rect x="40" y="722" width="436" height="42" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="258" y="741" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">harness</text>
  <text x="258" y="755" font-size="9.5" text-anchor="middle" fill="#57606a">통합 테스트 러너: 가상화 인스턴스 기동 및 클라이언트 계약 검증</text>
  <polyline points="255,722 255,656" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#am)"/>
  <rect x="508" y="690" width="468" height="88" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="524" y="712" font-size="10.5" font-weight="700" letter-spacing="1" fill="#8b95a1">거버넌스 및 운영</text>
  <rect x="524" y="722" width="210" height="42" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="629" y="741" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">registry</text>
  <text x="629" y="755" font-size="9.5" text-anchor="middle" fill="#57606a">기체 수명주기·바인딩·원장·변경 계획 관리</text>
  <rect x="750" y="722" width="210" height="42" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="855" y="741" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">gate</text>
  <text x="855" y="755" font-size="9.5" text-anchor="middle" fill="#57606a">프로파일 정합성 규칙 단일 검증 라이브러리</text>
  <polyline points="750,743 736,743" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#am)"/>
  <rect x="24" y="796" width="952" height="58" rx="6" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="44" y="819" font-size="11" fill="#57606a">녹색 4개 모듈만 기종 전용 코드를 포함하며, 그 외 모듈에 벤더/기종 심볼 유입 시 게이트 검사 7번이 빌드를 즉시 실패 처리합니다.</text>
  <text x="44" y="838" font-size="10" fill="#8b95a1">모듈 및 의존성 간선은 build.gradle.kts에서 자동 추출되며, 코어 계약 참조를 제외한 주요 런타임 의존성이 시각화되어 있습니다.</text>
</svg>
