<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="624" viewBox="0 0 1000 624" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <rect x="6" y="6" width="988" height="612" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="46" font-size="18" font-weight="600" fill="#c9d1d9">3계층 아키텍처 및 2대 시스템 경계</text>
  <text x="32" y="72" font-size="12.5" fill="#8b949e">미들웨어 코어 계약만 고정하며, 상위 시스템 및 하위 기종은 플러그형 확장 구조를 취함</text>
  <text x="32" y="93" font-size="12.5" fill="#8b949e">상위 소비자 및 하위 물리 기종 목록은 예시이며, 핵심 설계 목표는 두 경계면의 완전한 격리입니다.</text>
  <rect x="24" y="118" width="952" height="100" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="40" y="142" font-size="11" font-weight="700" letter-spacing="1" fill="#8b949e">① 상위 시스템 계층 (Upstream Consumers)</text>
  <rect x="40" y="158" width="47.8" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="63.9" y="179" font-size="11.5" text-anchor="middle" fill="#c9d1d9">MES</text>
  <rect x="97.8" y="158" width="87.4" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="141.5" y="179" font-size="11.5" text-anchor="middle" fill="#c9d1d9">WMS / WCS</text>
  <rect x="195.2" y="158" width="61" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="225.7" y="179" font-size="11.5" text-anchor="middle" fill="#c9d1d9">SCADA</text>
  <rect x="266.2" y="158" width="47.8" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="290.09999999999997" y="179" font-size="11.5" text-anchor="middle" fill="#c9d1d9">ERP</text>
  <rect x="324" y="158" width="94.6" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="371.3" y="179" font-size="11.5" text-anchor="middle" fill="#c9d1d9">라인 제어기</text>
  <rect x="428.6" y="158" width="167.8" height="34" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="512.5" y="179" font-size="11.5" text-anchor="middle" fill="#c9d1d9">기타 상위 도메인 시스템</text>
  <text x="40" y="244" font-size="11" font-weight="600" fill="#58a6ff">경계 ① (상위 경계): 작업 요구를 제시하고 협상하는 소비자 인터페이스 (consumer.kind: CLIENT | UPSTREAM_SYSTEM)</text>
  <rect x="24" y="260" width="952" height="104" rx="10" fill="#121d2f" stroke="#58a6ff"/>
  <text x="40" y="284" font-size="11" font-weight="700" letter-spacing="1" fill="#58a6ff">② 코어 계약 및 거버넌스 레지스트리 (Core Contracts &amp; Registry)</text>
  <rect x="40" y="298" width="454" height="50" rx="4" fill="#0d1117" stroke="#58a6ff"/>
  <text x="267" y="319" font-size="12.5" font-weight="600" text-anchor="middle" fill="#c9d1d9">표준 계약 (Protobuf)</text>
  <text x="267" y="337" font-size="10.5" text-anchor="middle" fill="#8b949e">스킬 명세 · 수명주기 상태 · 메타데이터 헤더 (불변 코어 축)</text>
  <rect x="506" y="298" width="454" height="50" rx="4" fill="#0d1117" stroke="#58a6ff"/>
  <text x="733" y="319" font-size="12.5" font-weight="600" text-anchor="middle" fill="#c9d1d9">거버넌스 레지스트리</text>
  <text x="733" y="337" font-size="10.5" text-anchor="middle" fill="#8b949e">기종 프로파일 · 어댑터 바인딩 · 소비자 접근 제어 원장</text>
  <text x="40" y="390" font-size="11" font-weight="600" fill="#58a6ff">경계 ② (하위 경계): 프로파일을 선언하고 표준 계약을 이행하는 어댑터 (벤더 통신 및 기종별 의존성 완전 격리)</text>
  <rect x="24" y="406" width="952" height="118" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="40" y="430" font-size="11" font-weight="700" letter-spacing="1" fill="#8b949e">③ 물리 기체 및 현장 설비 계층 (Physical Robots &amp; Facility Devices)</text>
  <rect x="40" y="444" width="146.66666666666666" height="62" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="113.33333333333333" y="461" font-size="10" text-anchor="middle" fill="#8b949e">Unitree</text>
  <text x="113.33333333333333" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#c9d1d9">G1</text>
  <text x="113.33333333333333" y="495" font-size="9.5" text-anchor="middle" fill="#8b949e">휴머노이드 · DDS</text>
  <rect x="194.66666666666666" y="444" width="146.66666666666666" height="62" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="268" y="461" font-size="10" text-anchor="middle" fill="#8b949e">Boston Dynamics</text>
  <text x="268" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#c9d1d9">Spot</text>
  <text x="268" y="495" font-size="9.5" text-anchor="middle" fill="#8b949e">4족보행 · gRPC</text>
  <rect x="349.3333333333333" y="444" width="146.66666666666666" height="62" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="422.66666666666663" y="461" font-size="10" text-anchor="middle" fill="#8b949e">Agility Robotics</text>
  <text x="422.66666666666663" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#c9d1d9">Digit</text>
  <text x="422.66666666666663" y="495" font-size="9.5" text-anchor="middle" fill="#8b949e">휴머노이드 · WebSocket</text>
  <rect x="504" y="444" width="146.66666666666666" height="62" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="577.3333333333334" y="461" font-size="10" text-anchor="middle" fill="#8b949e">Boston Dynamics</text>
  <text x="577.3333333333334" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#c9d1d9">Orbit</text>
  <text x="577.3333333333334" y="495" font-size="9.5" text-anchor="middle" fill="#8b949e">플릿 관리자 · HTTP</text>
  <rect x="658.6666666666666" y="444" width="146.66666666666666" height="62" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="732" y="461" font-size="10" text-anchor="middle" fill="#8b949e">산업 설비</text>
  <text x="732" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#c9d1d9">Modbus / TCP</text>
  <text x="732" y="495" font-size="9.5" text-anchor="middle" fill="#8b949e">설비 신호</text>
  <rect x="813.3333333333333" y="444" width="146.66666666666666" height="62" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="886.6666666666666" y="461" font-size="10" text-anchor="middle" fill="#8b949e">MiMic</text>
  <text x="886.6666666666666" y="479" font-size="12" font-weight="600" text-anchor="middle" fill="#c9d1d9">에뮬레이터</text>
  <text x="886.6666666666666" y="495" font-size="9.5" text-anchor="middle" fill="#8b949e">고충실도 가상화 기체</text>
  <rect x="24" y="546" width="952" height="56" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="44" y="569" font-size="11" fill="#8b949e">기종 확장 시에도 코어 계약은 불변 유지: 신규 기종 추가는 독립 프로파일 선언 및 전용 어댑터 모듈 구현만으로 완결</text>
  <text x="44" y="588" font-size="11" fill="#8b949e">게이트 검증(Gate Check 7)이 공용 코어 8개 모듈의 의존성을 정적 분석하여 기종 전용 심볼 침투를 빌드 실패로 원천 차단</text>
</svg>
