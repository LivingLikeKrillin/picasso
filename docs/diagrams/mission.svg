<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
  </defs>
  <rect x="6" y="6" width="988" height="608" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="46" font-size="18" font-weight="600" fill="#1f2328">임무 하나가 원자 단위 열이 되기까지</text>
  <text x="32" y="72" font-size="12.5" fill="#57606a">상류는 결과만 말한다 — 어느 로봇도, 어느 스킬도, 몇 개로 쪼갤지도 고르지 않는다.</text>
  <text x="32" y="93" font-size="12.5" fill="#57606a">쪼개는 규칙과 그것이 성립할 조건은 능력 한 장 안에 있다. 능력을 더해도 공통 엔진은 안 바뀐다.</text>
  <rect x="24" y="118" width="952" height="64" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="44" y="143" font-size="12.5" font-weight="600" fill="#1f2328">JobOrder — 상류(MES · WMS · SCADA)가 보내는 것</text>
  <text x="44" y="164" font-size="11" fill="#0969da">jobOrderId · workMasterId · version · requiredEvidence · equipmentRequirements[equipmentUse, properties] · parameters</text>
  <polyline points="500,182 500,196 174,196 174,210" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <polyline points="500,182 500,210" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <polyline points="500,182 500,196 826,196 826,210" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <rect x="18" y="204" width="312" height="320" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <rect x="24" y="212" width="300" height="150" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="42" y="236" font-size="13" font-weight="600" fill="#1f2328">PrepareSequencedRack</text>
  <text x="42" y="253" font-size="10" fill="#8b95a1">시나리오 ② · 부품 시퀀싱</text>
  <text x="42" y="274" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#8b95a1">읽는 것</text>
  <text x="42" y="290" font-size="10.5" fill="#1f2328">destination 요구 = 슬롯, material = 놓일 타입</text>
  <text x="42" y="305" font-size="10.5" fill="#1f2328">source 요구 = 제시 자리, material = 그 타입</text>
  <text x="42" y="326" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#8b95a1">나누는 규칙</text>
  <text x="42" y="342" font-size="10.5" fill="#1f2328">슬롯 하나 = 단위 하나</text>
  <text x="42" y="357" font-size="10.5" fill="#1f2328">타입으로 제시 자리를 찾아 짝짓는다</text>
  <polyline points="174,362 174,372 60,372 288,372" fill="none" stroke="#57606a" stroke-width="1.6"/>
