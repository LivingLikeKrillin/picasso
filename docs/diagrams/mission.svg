  <rect x="101" y="388" width="70" height="22" rx="4" fill="#eaf3ea" stroke="#1a7f37"/>
  <text x="136" y="403" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1a7f37">pick_place</text>
  <rect x="177" y="388" width="70" height="22" rx="4" fill="#eaf3ea" stroke="#1a7f37"/>
  <text x="212" y="403" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1a7f37">pick_place</text>
  <rect x="253" y="388" width="70" height="22" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="288" y="403" font-size="9.5" text-anchor="middle" fill="#8b95a1">슬롯 수만큼</text>
  <text x="174" y="430" font-size="10.5" text-anchor="middle" fill="#57606a">Route.ROBOT — 계약 카탈로그의 스킬로 나간다</text>
  <rect x="24" y="442" width="300" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="462" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a6700">최고 근거</text>
  <text x="104" y="462" font-size="10.5" fill="#1f2328">E2 — 셀 검증 장치가 있으면</text>
  <text x="40" y="480" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a6700">선택 인자</text>
  <text x="104" y="480" font-size="10.5" fill="#1f2328">verify_grasp — 드는 기종에만</text>
  <text x="40" y="498" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a6700">부족하면</text>
  <text x="104" y="498" font-size="10.5" fill="#1f2328">NO_SOURCE_FOR_MATERIAL</text>
  <rect x="344" y="204" width="312" height="320" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <rect x="350" y="212" width="300" height="150" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="368" y="236" font-size="13" font-weight="600" fill="#1f2328">DeliverContainer</text>
  <text x="368" y="253" font-size="10" fill="#8b95a1">시나리오 ① · 용기 공급</text>
  <text x="368" y="274" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#8b95a1">읽는 것</text>
  <text x="368" y="290" font-size="10.5" fill="#1f2328">source = 출발 인계점, container = 용기</text>
  <text x="368" y="305" font-size="10.5" fill="#1f2328">destination = 도착 인계점</text>
  <text x="368" y="326" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#8b95a1">나누는 규칙</text>
  <text x="368" y="342" font-size="10.5" fill="#1f2328">운반 하나 = 단위 하나</text>
  <text x="368" y="357" font-size="10.5" fill="#1f2328">경로도 배차도 안 짠다 — 플릿에 위임</text>
  <polyline points="500,362 500,388" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <rect x="452" y="388" width="96" height="22" rx="4" fill="#eaf3ea" stroke="#1a7f37"/>
  <text x="500" y="403" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1a7f37">transport</text>
  <text x="500" y="430" font-size="10.5" text-anchor="middle" fill="#57606a">Route.FLEET — 플릿이 운반 전체를 든다</text>
  <rect x="350" y="442" width="300" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="366" y="462" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a6700">최고 근거</text>
  <text x="430" y="462" font-size="10.5" fill="#1f2328">E2 — 인계 설비가 말하면</text>
  <text x="366" y="480" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a6700">선택 인자</text>
  <text x="430" y="480" font-size="10.5" fill="#1f2328">없다</text>
  <text x="366" y="498" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a6700">부족하면</text>
  <text x="430" y="498" font-size="10.5" fill="#1f2328">INCOMPLETE_ORDER</text>
  <rect x="670" y="204" width="312" height="320" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <rect x="676" y="212" width="300" height="150" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="694" y="236" font-size="13" font-weight="600" fill="#1f2328">InspectAsset</text>
  <text x="694" y="253" font-size="10" fill="#8b95a1">시나리오 ③ · 설비 점검 순회</text>
  <text x="694" y="274" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#8b95a1">읽는 것</text>
  <text x="694" y="290" font-size="10.5" fill="#1f2328">inspection_target 요구 = 점검 대상</text>
  <text x="694" y="305" font-size="10.5" fill="#1f2328">location = 살필 자리, item = 점검 항목</text>
  <text x="694" y="326" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#8b95a1">나누는 규칙</text>
  <text x="694" y="342" font-size="10.5" fill="#1f2328">대상 하나 = 단위 둘 (가서, 살핀다)</text>
  <text x="694" y="357" font-size="10.5" fill="#1f2328">목록의 순서가 순회 순서다</text>
