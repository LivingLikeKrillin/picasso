  <text x="712" y="403" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1a7f37">navigate_to</text>
  <rect x="753" y="388" width="70" height="22" rx="4" fill="#eaf3ea" stroke="#1a7f37"/>
  <text x="788" y="403" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1a7f37">inspect</text>
  <rect x="829" y="388" width="70" height="22" rx="4" fill="#eaf3ea" stroke="#1a7f37"/>
  <text x="864" y="403" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1a7f37">navigate_to</text>
  <rect x="905" y="388" width="70" height="22" rx="4" fill="#eaf3ea" stroke="#1a7f37"/>
  <text x="940" y="403" font-size="9.5" font-weight="600" text-anchor="middle" fill="#1a7f37">inspect</text>
  <text x="826" y="430" font-size="10.5" text-anchor="middle" fill="#57606a">Route.ROBOT — 대상 수 × 2</text>
  <rect x="676" y="442" width="300" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="692" y="462" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a6700">최고 근거</text>
  <text x="756" y="462" font-size="10.5" fill="#1f2328">E0 — 독립 확인 수단이 없다</text>
  <text x="692" y="480" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a6700">선택 인자</text>
  <text x="756" y="480" font-size="10.5" fill="#1f2328">mode — 주문에 있으면</text>
  <text x="692" y="498" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9a6700">부족하면</text>
  <text x="756" y="498" font-size="10.5" fill="#1f2328">NO_LOCATION_FOR_TARGET</text>
  <rect x="24" y="544" width="952" height="54" rx="6" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="44" y="566" font-size="11" fill="#57606a">요구 등급이 그 능력의 최고 등급을 넘으면 주문을 접수하지 않는다 — 확인할 수단이 없으면 제공할 수 없다. InspectAsset 에 E2 를 요구하면 여기서 걸린다.</text>
  <text x="44" y="585" font-size="11" fill="#57606a">시간창 δ(30s · 15s) · IN_DOUBT 유예(60s) · 정체 창(5분)은 능력 단위 설정이고 현장마다 다르게 준다 — picasso · LogicalCapability.kt</text>
