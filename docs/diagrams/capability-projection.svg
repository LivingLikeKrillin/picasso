<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="757" viewBox="0 0 1000 757" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <rect x="6" y="6" width="988" height="745" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="46" font-size="18" font-weight="600" fill="#1f2328">능력만 나가고 설정은 남는다</text>
  <text x="32" y="72" font-size="12.5" fill="#57606a">프로파일 문서가 통째로 나가지 않는다. 소비자가 판정에 쓰는 것만 걸러 나가고, 나머지는 문서에 남는다.</text>
  <text x="32" y="93" font-size="12.5" fill="#57606a">프로파일의 최상위 열셋 중 여덟이 Capability 로 나가고 다섯이 남는다.</text>
  <rect x="24" y="118" width="952" height="56" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="44" y="141" font-size="12.5" font-weight="600" fill="#1f2328">거르는 기준 — 소비자가 행동을 결정하는 데 필요한가</text>
  <text x="44" y="160" font-size="11" fill="#0969da">이 한 줄이 투영 함수의 명세다. 프로파일은 저작 형식이고, 로봇이 선언하는 것이 아니라 벤더 원문에서 사람이 파생한다.</text>
  <rect x="24" y="214" width="462" height="445" rx="10" fill="#eaf3ea" stroke="#1a7f37"/>
  <text x="40" y="238" font-size="11" font-weight="700" letter-spacing="1" fill="#1a7f37">Capability 로 나간다 — 여덟</text>
  <text x="40" y="254" font-size="10" fill="#57606a">소비자가 이것으로 판정한다</text>
  <rect x="36" y="266" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="285" font-size="11" font-weight="600" fill="#1f2328">vendor · model · profile_revision</text>
  <text x="50" y="301" font-size="10" fill="#57606a">어느 기종을 상대하는지 안다</text>
  <rect x="36" y="315" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="334" font-size="11" font-weight="600" fill="#1f2328">skills[] (major.minor)</text>
  <text x="50" y="350" font-size="10" fill="#57606a">SKILL_ABSENT 와 호환 판정</text>
  <rect x="36" y="364" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="383" font-size="11" font-weight="600" fill="#1f2328">skills[].pause_support · cancel_support</text>
  <text x="50" y="399" font-size="10" fill="#57606a">시도할지 말지를 가른다</text>
  <rect x="36" y="413" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="432" font-size="11" font-weight="600" fill="#1f2328">exclusive_control_required</text>
  <text x="50" y="448" font-size="10" fill="#57606a">제어권을 먼저 잡아야 하는가</text>
  <rect x="36" y="462" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="481" font-size="11" font-weight="600" fill="#1f2328">skills[].parameters</text>
  <text x="50" y="497" font-size="10" fill="#57606a">보내기 전에 값을 거른다</text>
  <rect x="36" y="511" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="530" font-size="11" font-weight="600" fill="#1f2328">optional_fields</text>
  <text x="50" y="546" font-size="10" fill="#57606a">REQUIRED_OPTIONAL_MISSING</text>
  <rect x="36" y="560" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="579" font-size="11" font-weight="600" fill="#1f2328">publish_interval</text>
  <text x="50" y="595" font-size="10" fill="#57606a">침묵이 고장인지 가른다</text>
  <rect x="36" y="609" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="628" font-size="11" font-weight="600" fill="#1f2328">protocol_limits</text>
  <text x="50" y="644" font-size="10" fill="#57606a">LIMIT_EXCEEDED</text>
  <rect x="514" y="214" width="462" height="445" rx="10" fill="#fbfcfd" stroke="#8b95a1"/>
  <text x="530" y="238" font-size="11" font-weight="700" letter-spacing="1" fill="#8b95a1">문서에 남는다 — 다섯</text>
  <text x="530" y="254" font-size="10" fill="#57606a">Capability 에 실을 자리가 없다</text>
  <rect x="526" y="266" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="540" y="285" font-size="11" font-weight="600" fill="#1f2328">schema_version</text>
  <text x="540" y="301" font-size="10" fill="#57606a">문서의 메타이지 능력이 아니다</text>
  <rect x="526" y="315" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="540" y="334" font-size="11" font-weight="600" fill="#1f2328">derived_from</text>
  <text x="540" y="350" font-size="10" fill="#57606a">이 선언이 어느 벤더 원문에서 나왔는지 — 사람이 읽는다</text>
  <rect x="526" y="364" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="540" y="383" font-size="11" font-weight="600" fill="#1f2328">durations</text>
  <text x="540" y="399" font-size="10" fill="#57606a">소요시간 상수와 지터. 소비자는 진행률을 받는다</text>
  <rect x="526" y="413" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="540" y="432" font-size="11" font-weight="600" fill="#1f2328">failure_modes</text>
  <text x="540" y="448" font-size="10" fill="#57606a">시뮬레이션 값이고 발신자 안에서만 쓴다</text>
  <rect x="526" y="462" width="438" height="44" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="540" y="481" font-size="11" font-weight="600" fill="#1f2328">replay_buffer_size</text>
  <text x="540" y="497" font-size="10" fill="#57606a">발신자 내부 자원이다</text>
  <rect x="24" y="679" width="952" height="56" rx="6" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="44" y="702" font-size="11" fill="#57606a">같은 경계를 두 곳이 지킨다. 런타임은 Capability 에 그 필드가 아예 없고,</text>
  <text x="44" y="721" font-size="11" fill="#57606a">CI 에서는 게이트 6번이 같은 목록을 지운 뒤 버전 규칙을 판정한다.</text>
</svg>
