<svg xmlns="http://www.w3.org/2000/svg" width="840" height="648" viewBox="0 0 840 648">
  <defs>
    <marker id="data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#e6e6e6" stroke-width="1.2"/>
    </marker>
    <marker id="obs" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#9a9a9a" stroke-width="1.2"/>
    </marker>
    <marker id="cmd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d4654a"/>
    </marker>
    <marker id="gov" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8fa2cc" stroke-width="1.2"/>
    </marker>
  </defs>

  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" fill="#e6e6e6">
    <text x="20" y="36" font-size="17" font-weight="700">실행 흐름과 승인</text>
    <text x="20" y="56" font-size="12" fill="#9a9a9a">주문 접수와 pump 단일 실행 조율, 대안 제안과 승인 흐름.</text>
    <text x="820" y="36" font-size="11" fill="#9a9a9a" text-anchor="end">상태를 바꾸는 주체는 하나뿐이다</text>
    <text x="820" y="52" font-size="11" fill="#9a9a9a" text-anchor="end">밖은 파일로 읽고 창구로만 쓴다</text>

    <!-- ===== zone: outside ===== -->
    <rect x="32" y="84" width="776" height="72" fill="none" stroke="#4a4a4a"/>
    <text x="44" y="100" font-size="11" fill="#9a9a9a">상류 시스템, 운영자, 에이전트층</text>
    <rect x="48" y="108" width="184" height="32" fill="none" stroke="#4a4a4a"/>
    <text x="60" y="129" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MES, WMS</text>
    <rect x="328" y="108" width="184" height="32" fill="none" stroke="#4a4a4a"/>
    <text x="340" y="129" font-size="12">운영자</text>
    <rect x="624" y="108" width="184" height="32" fill="none" stroke="#4a4a4a"/>
    <text x="636" y="129" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">narrator, koshei</text>

    <!-- ===== zone: this repository ===== -->
    <rect x="32" y="184" width="776" height="304" fill="none" stroke="#8fa2cc"/>
    <text x="48" y="202" font-size="11" font-weight="700" fill="#8fa2cc">이 저장소</text>
    <rect x="48" y="224" width="184" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="60" y="247" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">submit</text>
    <text x="60" y="263" font-size="11" fill="#9a9a9a">접수 관문. 사슬 검사</text>
    <rect x="328" y="224" width="184" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="340" y="247" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">RemedyDesk</text>
    <text x="340" y="263" font-size="11" fill="#9a9a9a">대안 탐색. 제안 수립</text>
    <rect x="624" y="224" width="184" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="636" y="247" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ApprovalHost</text>
    <text x="636" y="263" font-size="11" fill="#9a9a9a">승인 창구. 루프백 HTTP</text>
    <rect x="48" y="320" width="464" height="52" fill="#2b3f6b" stroke="#8fa2cc" stroke-width="1.5"/>
    <rect x="52" y="324" width="456" height="44" fill="none" stroke="#fff" stroke-width="0.75" stroke-opacity="0.6"/>
    <text x="64" y="343" font-size="12.5" font-weight="700" fill="#fff" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Middleware.pump</text>
    <text x="64" y="359" font-size="11" fill="#cfd6e6">상태를 바꾸는 단일 적용자. 실행 조율, 명령 하달, 결과 통보</text>
    <rect x="624" y="320" width="184" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="636" y="343" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">build/export/live</text>
    <text x="636" y="359" font-size="11" fill="#9a9a9a">사건, 대안 탐색, 결과 파일</text>
    <rect x="48" y="416" width="184" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="60" y="439" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">adapter-*</text>
    <text x="60" y="455" font-size="11" fill="#9a9a9a">SDK 호출. 상태 보고</text>

    <!-- ===== zone: field ===== -->
    <rect x="32" y="512" width="776" height="72" fill="none" stroke="#4a4a4a"/>
    <text x="44" y="528" font-size="11" fill="#9a9a9a">현장 (로봇 기체, 셀 설비)</text>
    <rect x="48" y="536" width="184" height="32" fill="none" stroke="#4a4a4a"/>
    <text x="60" y="557" font-size="12">로봇 기체</text>
    <rect x="328" y="536" width="184" height="32" fill="none" stroke="#4a4a4a"/>
    <text x="340" y="557" font-size="12">셀 설비</text>

    <!-- ===== edges: data ===== -->
    <g fill="none" stroke="#e6e6e6" stroke-width="1.2">
      <path d="M200,140 V222" marker-end="url(#data)"/>
      <path d="M48,346 H16 V124 H46" marker-end="url(#data)"/>
      <path d="M140,276 V318" marker-end="url(#data)"/>
      <path d="M232,250 H326" marker-end="url(#data)"/>
      <path d="M512,346 H622" marker-end="url(#data)"/>
      <path d="M488,276 V300 H700 V318" marker-end="url(#data)"/>
    </g>
    <g font-size="10.5" fill="#e6e6e6">
      <text x="208" y="176" font-size="10.5">JobOrder 발주</text>
      <text x="24" y="176" font-size="10.5">JobResponse 통보</text>
      <text x="148" y="302" font-size="10.5">주문 전달</text>
      <text x="240" y="243" font-size="10.5">거절로 제안 수립</text>
      <text x="520" y="339" font-size="10.5">사건과 결과 쓰기</text>
      <text x="520" y="293" font-size="10.5">탐색 대장 쓰기</text>
    </g>

    <!-- ===== edges: command ===== -->
    <g fill="none" stroke="#d4654a" stroke-width="2">
      <path d="M716,140 V222" marker-end="url(#cmd)"/>
      <path d="M624,250 H514" marker-end="url(#cmd)"/>
      <path d="M380,140 V222" marker-end="url(#cmd)"/>
      <path d="M440,276 V318" marker-end="url(#cmd)"/>
      <path d="M100,372 V414" marker-end="url(#cmd)"/>
      <path d="M216,468 V534" marker-end="url(#cmd)"/>
    </g>
    <g font-size="10.5" fill="#d4654a">
      <text x="708" y="200" font-size="10.5" text-anchor="end">POST /approvals</text>
      <text x="520" y="243" font-size="10.5">제안을 승인</text>
      <text x="388" y="176" font-size="10.5">제안 직접 승인</text>
      <text x="432" y="302" font-size="10.5" text-anchor="end">승인된 조치 실행</text>
      <text x="108" y="398" font-size="10.5">gRPC 명령</text>
      <text x="224" y="504" font-size="10.5">SDK 호출</text>
    </g>

    <!-- ===== edges: observation ===== -->
    <g fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3">
      <path d="M808,346 H824 V124 H810" marker-end="url(#obs)"/>
      <path d="M200,416 V374" marker-end="url(#obs)"/>
      <path d="M420,536 V374" marker-end="url(#obs)"/>
    </g>
    <g font-size="10.5" fill="#9a9a9a">
      <text x="816" y="176" font-size="10.5" text-anchor="end">파일 읽기</text>
      <text x="208" y="398" font-size="10.5">MQTT 상태보고</text>
      <text x="428" y="444" font-size="10.5">독립 확인 신호</text>
    </g>

    <!-- ===== key ===== -->
    <text x="820" y="608" font-size="10.5" fill="#9a9a9a" text-anchor="end">승인 창구는 지금 참조 구동기가 연다.</text>
    <g font-size="10.5" fill="#9a9a9a">
      <path d="M20,624 H44" fill="none" stroke="#e6e6e6" stroke-width="1.2"/>
      <text x="50" y="628" font-size="11">데이터</text>
      <path d="M107,624 H131" fill="none" stroke="#d4654a" stroke-width="2"/>
      <text x="137" y="628" font-size="11">명령, 쓰기</text>
      <path d="M227,624 H251" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3"/>
      <text x="257" y="628" font-size="11">관측</text>
      <rect x="303" y="618" width="14" height="10" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
      <text x="323" y="628" font-size="11">이 저장소</text>
      <rect x="402" y="618" width="14" height="10" fill="#2b3f6b" stroke="#8fa2cc"/>
      <text x="422" y="628" font-size="11">핵심 모듈</text>
      <rect x="501" y="618" width="14" height="10" fill="none" stroke="#4a4a4a"/>
      <text x="521" y="628" font-size="11">외부 시스템</text>
    </g>
  </g>
</svg>
