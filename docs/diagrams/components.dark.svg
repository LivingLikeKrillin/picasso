<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="876" viewBox="0 0 1000 876" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="am" markerWidth="8" markerHeight="8" refX="6.5" refY="2.75" orient="auto"><path d="M0,0 L6.5,2.75 L0,5.5 Z" fill="#8b949e"/></marker>
  </defs>
  <!-- edge: adapter-agility-digit -> adapter-core -->
  <!-- edge: adapter-boston-dynamics-orbit -> adapter-core -->
  <!-- edge: adapter-boston-dynamics-orbit -> adapter-host -->
  <!-- edge: adapter-boston-dynamics-orbit -> uplink -->
  <!-- edge: adapter-boston-dynamics-spot -> adapter-core -->
  <!-- edge: adapter-host -> adapter-core -->
  <!-- edge: adapter-host -> capability -->
  <!-- edge: adapter-host -> uplink -->
  <!-- edge: adapter-unitree-g1 -> adapter-core -->
  <!-- edge: harness -> client -->
  <!-- edge: harness -> mimic -->
  <!-- edge: harness -> uplink -->
  <!-- edge: mimic -> capability -->
  <!-- edge: mimic -> uplink -->
  <!-- edge: picasso -> client -->
  <!-- edge: registry -> gate -->
  <rect x="6" y="6" width="988" height="864" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="46" font-size="18" font-weight="600" fill="#c9d1d9">가운데는 어휘이고, 위아래는 갈아 끼워진다</text>
  <text x="32" y="72" font-size="12.5" fill="#8b949e">모듈 16 개. 계약 어휘 둘은 프로젝트 안의 무엇도 안 쓰고, 나머지 열넷이 그 위에 선다.</text>
  <text x="32" y="93" font-size="12.5" fill="#8b949e">발신자 둘이 같은 자리에 서고, 기종을 아는 넷은 그중 하나 안에만 있다.</text>
  <rect x="24" y="130" width="952" height="84" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="40" y="152" font-size="10.5" font-weight="700" letter-spacing="1" fill="#8b949e">소비자 — 계약을 두드린다</text>
  <rect x="40" y="162" width="452" height="38" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="54" y="180" font-size="12.5" font-weight="600" fill="#c9d1d9">picasso</text>
  <text x="54" y="194" font-size="9.5" fill="#8b949e">미들웨어의 가운데. 접수 → 조합 → 실행 → 근거 결합. 기종을 모른다</text>
  <rect x="508" y="162" width="452" height="38" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="522" y="180" font-size="12.5" font-weight="600" fill="#c9d1d9">client</text>
  <text x="522" y="194" font-size="9.5" fill="#8b949e">계약을 두드려 완료 기준을 증명하는 얇은 소비자</text>
  <polyline points="492,181 506,181" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#am)"/>
  <rect x="24" y="254" width="952" height="104" rx="10" fill="#121d2f" stroke="#58a6ff"/>
  <text x="42" y="279" font-size="11" font-weight="700" letter-spacing="1" fill="#58a6ff">계약 어휘 — 프로젝트 내 의존 0</text>
  <rect x="42" y="290" width="450" height="52" rx="4" fill="#0d1117" stroke="#58a6ff"/>
  <text x="58" y="313" font-size="14.5" font-weight="600" fill="#c9d1d9">contracts</text>
  <text x="58" y="331" font-size="10" fill="#8b949e">proto. 스킬 · 태스크 · 이벤트 · 결함</text>
  <text x="476" y="313" font-size="12" font-weight="600" text-anchor="end" fill="#58a6ff">13 이 쓴다</text>
  <rect x="508" y="290" width="450" height="52" rx="4" fill="#0d1117" stroke="#58a6ff"/>
  <text x="524" y="313" font-size="14.5" font-weight="600" fill="#c9d1d9">profile-model</text>
  <text x="524" y="331" font-size="10" fill="#8b949e">프로파일 문서의 읽기 전용 모델</text>
  <text x="942" y="313" font-size="12" font-weight="600" text-anchor="end" fill="#58a6ff">7 이 쓴다</text>
  <text x="500" y="240" font-size="10.5" text-anchor="middle" fill="#58a6ff">↑ 소비자 둘이 여기 기댄다</text>
  <text x="500" y="380" font-size="10.5" text-anchor="middle" fill="#58a6ff">↓ 아래 열둘도 전부 여기 기댄다 — 그 화살표 20 개는 안 그렸다</text>
  <rect x="24" y="398" width="952" height="272" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="40" y="420" font-size="10.5" font-weight="700" letter-spacing="1" fill="#8b949e">발신자 — 계약을 구현해 선다</text>
  <rect x="40" y="430" width="920" height="44" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="54" y="448" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">공유 부품</text>
  <text x="54" y="464" font-size="9.5" fill="#8b949e">아래 둘이 함께 쓴다</text>
  <text x="150" y="450" font-size="12" font-weight="600" fill="#c9d1d9">capability</text>
  <text x="150" y="465" font-size="9.5" fill="#8b949e">프로파일 → Capability 투영과 협상. 전송을 모른다</text>
  <text x="548" y="450" font-size="12" font-weight="600" fill="#c9d1d9">uplink</text>
  <text x="548" y="465" font-size="9.5" fill="#8b949e">브로커 발행과 레지스트리 적재</text>
  <rect x="40" y="490" width="430" height="162" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="255" y="517" font-size="14" font-weight="600" text-anchor="middle" fill="#c9d1d9">mimic</text>
  <text x="255" y="535" font-size="10.5" text-anchor="middle" fill="#8b949e">프로파일 주도 에뮬레이터</text>
  <text x="255" y="551" font-size="10" text-anchor="middle" fill="#8b949e">「어댑터 + 로봇」 한 쌍을 대신한다</text>
  <rect x="64" y="566" width="382" height="66" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="255" y="590" font-size="12" font-weight="600" text-anchor="middle" fill="#8b949e">프로파일 한 장</text>
  <text x="255" y="608" font-size="9.5" text-anchor="middle" fill="#8b949e">기종이 곧 이 문서다</text>
  <text x="255" y="623" font-size="9.5" text-anchor="middle" fill="#8b949e">실물이 아니어도 된다</text>
  <rect x="530" y="490" width="430" height="162" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="745" y="517" font-size="14" font-weight="600" text-anchor="middle" fill="#c9d1d9">adapter-host</text>
  <text x="745" y="535" font-size="10" text-anchor="middle" fill="#8b949e">어댑터 하나를 계약의 gRPC 서비스 뒤에 세운다 · 기종을 모른다</text>
  <rect x="546" y="546" width="398" height="58" rx="5" fill="#0f2f1a" stroke="#3fb950"/>
  <text x="745" y="563" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3fb950">기종 어댑터 넷 — 기종을 아는 유일한 자리</text>
  <rect x="552" y="572" width="96.5" height="22" rx="3" fill="#0d1117" stroke="#3fb950"/>
  <text x="600.25" y="587" font-size="9.5" text-anchor="middle" fill="#3fb950">unitree-g1</text>
  <rect x="652.5" y="572" width="96.5" height="22" rx="3" fill="#0d1117" stroke="#3fb950"/>
  <text x="700.75" y="587" font-size="9.5" text-anchor="middle" fill="#3fb950">spot</text>
  <rect x="753" y="572" width="96.5" height="22" rx="3" fill="#0d1117" stroke="#3fb950"/>
  <text x="801.25" y="587" font-size="9.5" text-anchor="middle" fill="#3fb950">agility-digit</text>
  <rect x="853.5" y="572" width="96.5" height="22" rx="3" fill="#0d1117" stroke="#3fb950"/>
  <text x="901.75" y="587" font-size="9.5" text-anchor="middle" fill="#3fb950">orbit</text>
  <rect x="546" y="610" width="398" height="28" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="745" y="628" font-size="9.5" text-anchor="middle" fill="#8b949e">adapter-core — 넷이 공유하는 RobotAdapter. 기종을 모른다</text>
  <polyline points="474,500 526,500" fill="none" stroke="#22334d" stroke-width="1.5"/>
  <polyline points="474,642 526,642" fill="none" stroke="#22334d" stroke-width="1.5"/>
  <text x="500" y="566" font-size="10.5" font-weight="700" text-anchor="middle" fill="#58a6ff">같은</text>
  <text x="500" y="581" font-size="10.5" font-weight="700" text-anchor="middle" fill="#58a6ff">자리</text>
  <rect x="24" y="690" width="468" height="88" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="40" y="712" font-size="10.5" font-weight="700" letter-spacing="1" fill="#8b949e">시험</text>
  <rect x="40" y="722" width="436" height="42" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="258" y="741" font-size="12" font-weight="600" text-anchor="middle" fill="#c9d1d9">harness</text>
  <text x="258" y="755" font-size="9.5" text-anchor="middle" fill="#8b949e">계약 스위트의 주인 — mimic 을 띄우고 client 로 돈다</text>
  <polyline points="255,722 255,656" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#am)"/>
  <rect x="508" y="690" width="468" height="88" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="524" y="712" font-size="10.5" font-weight="700" letter-spacing="1" fill="#8b949e">운영</text>
  <rect x="524" y="722" width="210" height="42" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="629" y="741" font-size="12" font-weight="600" text-anchor="middle" fill="#c9d1d9">registry</text>
  <text x="629" y="755" font-size="9.5" text-anchor="middle" fill="#8b949e">수명주기 · 바인딩 · 원장 · 변경 계획</text>
  <rect x="750" y="722" width="210" height="42" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="855" y="741" font-size="12" font-weight="600" text-anchor="middle" fill="#c9d1d9">gate</text>
  <text x="855" y="755" font-size="9.5" text-anchor="middle" fill="#8b949e">검증 규칙의 단일 구현</text>
  <polyline points="750,743 736,743" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#am)"/>
  <rect x="24" y="796" width="952" height="58" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="44" y="819" font-size="11" fill="#8b949e">초록 넷만 기종 이름을 안다. 나머지에 벤더·모델 문자열이 들어오면 게이트 검사 7번이 CI 를 실패시킨다 — 주석이라도 걸린다.</text>
  <text x="44" y="838" font-size="10" fill="#8b949e">칸과 간선은 각 build.gradle.kts 에서 읽는다. 주석이 어휘 둘로 가지 않는 출하 간선 전부를 싣고, 그림은 그중 일부를 화살표로 일부를 담기로 보인다.</text>
</svg>
