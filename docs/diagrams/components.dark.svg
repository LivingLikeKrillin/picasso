  <text x="44" y="557" font-size="11" fill="#8b949e">초록 둘만 기종 이름을 안다. 나머지에는 벤더·모델 문자열이 들어오면 안 되고,</text>
  <text x="44" y="576" font-size="11" fill="#8b949e">게이트 검사 7번이 그 모듈들의 소스를 훑어 CI 실패 조건으로 막는다 — 주석이라도 걸린다.</text>
  <text x="44" y="595" font-size="10" fill="#8b949e">이 그림의 칸과 화살표는 각 build.gradle.kts 에서 읽어 그린다. ComponentMapTest 가 같은 것을 다시 읽어 댄다.</text>
