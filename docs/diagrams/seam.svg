<svg xmlns="http://www.w3.org/2000/svg" width="840" height="824" viewBox="0 0 840 824">
  <defs>
    <marker id="data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#262626" stroke-width="1.2"/>
    </marker>
    <marker id="obs" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#6f6f6f" stroke-width="1.2"/>
    </marker>
    <marker id="cmd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#b23a1d"/>
    </marker>
    <marker id="gov" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#2b3f6b" stroke-width="1.2"/>
    </marker>
  </defs>

  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" fill="#262626">
    <text x="20" y="36" font-size="17" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">picasso</text>
    <text x="20" y="56" font-size="12" fill="#6f6f6f">공장 운영 시스템과 이기종 모바일 로봇을 잇는 표준 계약 이음매.</text>
    <text x="820" y="36" font-size="11" fill="#6f6f6f" text-anchor="end">기종 식별자는 어댑터 넷에만 있다</text>
    <text x="820" y="52" font-size="11" fill="#6f6f6f" text-anchor="end">게이트 검사 7이 기종 분기 차단</text>

    <!-- ===== zone: upstream ===== -->
    <rect x="32" y="84" width="776" height="72" fill="none" stroke="#bdbdbd"/>
    <text x="44" y="100" font-size="11" fill="#6f6f6f">상류 공장 운영 시스템</text>
    <rect x="212" y="112" width="200" height="32" fill="none" stroke="#bdbdbd"/>
    <text x="224" y="133" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MES, WMS, SCADA</text>

    <!-- ===== zone: model-agnostic ===== -->
    <rect x="32" y="184" width="560" height="344" fill="none" stroke="#2b3f6b"/>
    <text x="48" y="202" font-size="11" font-weight="700" fill="#2b3f6b">기종 비종속 영역</text>
    <text x="48" y="218" font-size="11" fill="#6f6f6f">게이트 검사 7이 공용 모듈 기종 분기를 차단한다.</text>
    <rect x="192" y="244" width="240" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="204" y="267" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">picasso</text>
    <text x="204" y="283" font-size="11" fill="#6f6f6f">미들웨어 코어. 접수, 협상, 조율</text>
    <rect x="152" y="344" width="320" height="52" fill="#2b3f6b" stroke="#2b3f6b" stroke-width="1.5"/>
    <rect x="156" y="348" width="312" height="44" fill="none" stroke="#fff" stroke-width="0.75" stroke-opacity="0.6"/>
    <text x="168" y="367" font-size="12.5" font-weight="700" fill="#fff" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">contracts</text>
    <text x="168" y="383" font-size="11" fill="#cfd6e6">표준 계약. gRPC 명령, MQTT 원격측정</text>
    <rect x="48" y="448" width="240" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="60" y="471" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">adapter-host</text>
    <text x="60" y="487" font-size="11" fill="#6f6f6f">기종 비종속. 단일 어댑터 호스팅</text>
    <rect x="336" y="448" width="240" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="348" y="471" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">mimic</text>
    <text x="348" y="487" font-size="11" fill="#6f6f6f">프로파일 주도. 계약 에뮬레이터</text>

    <!-- right column: gate, seam note, parity -->
    <rect x="624" y="244" width="184" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="636" y="267" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">gate</text>
    <text x="636" y="283" font-size="11" fill="#6f6f6f">검사 7. 기종 분기 유입 검사</text>
    <text x="624" y="364" font-size="11" fill="#6f6f6f">계약 하나가 이음매다</text>
    <text x="624" y="380" font-size="11" fill="#6f6f6f">위층은 기종을 모른다</text>
    <text x="624" y="396" font-size="11" fill="#6f6f6f">아래층만 기종을 안다</text>
    <rect x="624" y="448" width="184" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="636" y="471" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">HostParityTest</text>
    <text x="636" y="487" font-size="11" fill="#6f6f6f">호스트와 mimic 대조</text>

    <!-- ===== zone: model-specific ===== -->
    <rect x="32" y="560" width="560" height="96" fill="none" stroke="#bdbdbd"/>
    <text x="44" y="576" font-size="11" fill="#6f6f6f">기종 전용 영역 (어댑터 넷)</text>
    <rect x="48" y="588" width="336" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="60" y="611" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">adapter-*</text>
    <text x="60" y="627" font-size="11" fill="#6f6f6f">기종 전용 어댑터. unitree-g1, spot, agility-digit, orbit</text>

    <!-- ===== zone: vendor ===== -->
    <rect x="32" y="688" width="560" height="72" fill="none" stroke="#bdbdbd"/>
    <text x="44" y="704" font-size="11" fill="#6f6f6f">벤더 SDK (저장소 밖)</text>
    <rect x="48" y="716" width="240" height="32" fill="none" stroke="#bdbdbd"/>
    <text x="60" y="737" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Spot, Digit, G1, Orbit</text>

    <!-- ===== edges: data ===== -->
    <g fill="none" stroke="#262626" stroke-width="1.2">
      <path d="M292,144 V242" marker-end="url(#data)"/>
      <path d="M332,244 V146" marker-end="url(#data)"/>
    </g>
    <g font-size="10.5" fill="#262626">
      <text x="284" y="176" font-size="10.5" text-anchor="end">JobOrder 발주</text>
      <text x="340" y="176" font-size="10.5">JobResponse 통보</text>
    </g>

    <!-- ===== edges: command ===== -->
    <g fill="none" stroke="#b23a1d" stroke-width="2">
      <path d="M312,296 V342" marker-end="url(#cmd)"/>
      <path d="M196,396 V446" marker-end="url(#cmd)"/>
      <path d="M428,396 V446" marker-end="url(#cmd)"/>
      <path d="M264,500 V586" marker-end="url(#cmd)"/>
      <path d="M264,640 V714" marker-end="url(#cmd)"/>
    </g>
    <g font-size="10.5" fill="#b23a1d">
      <text x="320" y="324" font-size="10.5">명령과 질의 전달</text>
      <text x="204" y="428" font-size="10.5">명령 전달</text>
      <text x="436" y="428" font-size="10.5">명령 전달</text>
      <text x="256" y="520" font-size="10.5" text-anchor="end">기종 어댑터 위임</text>
      <text x="256" y="676" font-size="10.5" text-anchor="end">벤더 SDK 호출</text>
    </g>

    <!-- ===== edges: control ===== -->
    <g fill="none" stroke="#2b3f6b" stroke-width="1.2" stroke-dasharray="1.5 2.5">
      <path d="M624,270 H434" marker-end="url(#gov)"/>
    </g>
    <g font-size="10.5" fill="#2b3f6b">
      <text x="440" y="263" font-size="10.5">기종 분기 차단</text>
    </g>

    <!-- ===== edges: observation ===== -->
    <g fill="none" stroke="#6f6f6f" stroke-width="1.2" stroke-dasharray="5 3">
      <path d="M576,474 H622" marker-end="url(#obs)"/>
      <path d="M288,488 H316 V544 H716 V502" marker-end="url(#obs)"/>
    </g>
    <g font-size="10.5" fill="#6f6f6f">
      <text x="708" y="524" font-size="10.5" text-anchor="end">판정 결과 대조</text>
    </g>

    <!-- ===== key ===== -->
    <text x="820" y="784" font-size="10.5" fill="#6f6f6f" text-anchor="end">같은 계약에 실물과 에뮬레이터가 똑같이 붙는다</text>
    <g font-size="10.5" fill="#6f6f6f">
      <path d="M20,800 H44" fill="none" stroke="#262626" stroke-width="1.2"/>
      <text x="50" y="804" font-size="11">데이터</text>
      <path d="M107,800 H131" fill="none" stroke="#b23a1d" stroke-width="2"/>
      <text x="137" y="804" font-size="11">명령, 쓰기</text>
      <path d="M227,800 H251" fill="none" stroke="#2b3f6b" stroke-width="1.2" stroke-dasharray="1.5 2.5"/>
      <text x="257" y="804" font-size="11">통제</text>
      <path d="M303,800 H327" fill="none" stroke="#6f6f6f" stroke-width="1.2" stroke-dasharray="5 3"/>
      <text x="333" y="804" font-size="11">관측</text>
      <rect x="379" y="794" width="14" height="10" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
      <text x="399" y="804" font-size="11">이 저장소</text>
      <rect x="478" y="794" width="14" height="10" fill="#2b3f6b" stroke="#2b3f6b"/>
      <text x="498" y="804" font-size="11">핵심 모듈</text>
      <rect x="577" y="794" width="14" height="10" fill="none" stroke="#bdbdbd"/>
      <text x="597" y="804" font-size="11">외부 시스템</text>
    </g>
  </g>
</svg>
