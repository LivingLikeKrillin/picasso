<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <rect x="6" y="6" width="988" height="560" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="46" font-size="18" font-weight="600" fill="#1f2328">시스템 변경의 4대 독립 축과 가역성</text>
  <text x="32" y="72" font-size="12.5" fill="#57606a">계약·프로파일·어댑터·바인딩이 상호 독립적으로 변경되며, 비가역적 위험을 단일 축(계약)으로 국소화했습니다.</text>
  <text x="32" y="93" font-size="12.5" fill="#57606a">하위 3개 축은 명확한 런타임/배포 롤백 절차를 지원하며, 최상위 계약 축만 엄격한 호환성 규칙을 적용받습니다.</text>
  <text x="44" y="118" font-size="10" font-weight="700" letter-spacing="1" fill="#8b95a1">변경 축 (Axis)</text>
  <text x="200" y="118" font-size="10" font-weight="700" letter-spacing="1" fill="#8b95a1">변경 메커니즘 및 영향 범위</text>
  <text x="557" y="118" font-size="10" font-weight="700" letter-spacing="1" fill="#8b95a1">롤백 전략 및 복구 메커니즘</text>
  <rect x="24" y="144" width="952" height="78" rx="6" fill="#ffebe9" stroke="#cf222e"/>
  <text x="44" y="174" font-size="14" font-weight="600" fill="#1f2328">계약 (Contract)</text>
  <text x="44" y="194" font-size="10" fill="#8b95a1">contracts/proto</text>
  <text x="200" y="174" font-size="11" fill="#1f2328">SemVer 기반 배포를 통한 변경</text>
  <text x="557" y="174" font-size="11.5" font-weight="600" fill="#cf222e">비가역적 (롤백 불가)</text>
  <text x="557" y="194" font-size="10.5" fill="#57606a">소비자 클라이언트의 Codegen 의존성 고착</text>
  <rect x="24" y="228" width="952" height="78" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="258" font-size="14" font-weight="600" fill="#1f2328">프로파일 (Profile)</text>
  <text x="44" y="278" font-size="10" fill="#8b95a1">profile/profiles/*.json</text>
  <text x="200" y="258" font-size="11" fill="#1f2328">신규 개정판(Revision) 등록을 통한 변경</text>
  <text x="557" y="258" font-size="11.5" font-weight="600" fill="#1a7f37">SUPERSEDED 개정판 재활성화(롤백)</text>
  <text x="557" y="278" font-size="10.5" fill="#57606a">BindingService의 이전 개정판 불변 보존 및 상태 전이 관리</text>
  <rect x="24" y="312" width="952" height="78" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="342" font-size="14" font-weight="600" fill="#1f2328">어댑터 (Adapter)</text>
  <text x="44" y="362" font-size="10" fill="#8b95a1">adapter-&lt;기종&gt;</text>
  <text x="200" y="342" font-size="11" fill="#1f2328">기종별 프로토콜 변환 구현체 (바이너리 배포 단위)</text>
  <text x="557" y="342" font-size="11.5" font-weight="600" fill="#1a7f37">이전 바이너리 릴리즈 재배포</text>
  <text x="557" y="362" font-size="10.5" fill="#57606a">기종 전용 지식은 어댑터 모듈 경계 내에만 캡슐화</text>
  <rect x="24" y="396" width="952" height="78" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="426" font-size="14" font-weight="600" fill="#1f2328">바인딩 (Binding)</text>
  <text x="44" y="446" font-size="10" fill="#8b95a1">기체 ID = 어댑터 + 프로파일 개정판</text>
  <text x="200" y="426" font-size="11" fill="#1f2328">런타임 무중단 동적 전환 (배포 불필요)</text>
  <text x="557" y="426" font-size="11.5" font-weight="600" fill="#1a7f37">이전 바인딩 매핑 복원</text>
  <text x="557" y="446" font-size="10.5" fill="#57606a">원장 내 바인딩 전이 감사 이력(Audit Trail) 완전 보존</text>
  <rect x="24" y="494" width="952" height="56" rx="6" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="44" y="517" font-size="11" fill="#57606a">기체 단위 독립 바인딩 매핑을 통해 무중단 카나리 배포를 구조적으로 지원 (선별 기체에만 신규 조합 적용)</text>
  <text x="44" y="536" font-size="11" fill="#57606a">기체별 활성 개정판은 요청 헤더의 profile_ref 필드로 전파 및 관측되며, 롤백 대상 기체 식별의 기준값으로 사용됨</text>
</svg>
