    <text x="48" y="218" font-size="11" fill="#9a9a9a">gate 검사 7로 기종별 분기 부재 검증</text>
    <rect x="192" y="244" width="240" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
