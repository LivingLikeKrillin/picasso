<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1112" viewBox="0 0 1000 1112" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <rect x="6" y="6" width="988" height="1100" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="46" font-size="18" font-weight="600" fill="#c9d1d9">물리 하드웨어 및 현장 연동을 위한 9대 교체 경계면 (Integration Seams)</text>
  <text x="32" y="72" font-size="12.5" fill="#8b949e">각 경계면은 단일 인터페이스 계약으로 정의되며, 해당 인터페이스 구현만으로 연동이 완결됩니다.</text>
  <text x="32" y="93" font-size="12.5" fill="#8b949e">9개 경계면은 상호 독립적으로 격리되어 특정 설비/기종 전환 시 타 컴포넌트 영향이 차단됩니다.</text>
  <rect x="24" y="118" width="952" height="54" rx="6" fill="#0f2f1a" stroke="#3fb950"/>
  <text x="44" y="141" font-size="12.5" font-weight="600" fill="#c9d1d9">미들웨어 코어 — picasso · contracts · adapter-host · capability · uplink · profile-model</text>
  <text x="44" y="160" font-size="11" fill="#3fb950">상기 6개 코어 컴포넌트는 물리 장비 종속성이 없으며, 현장 연동 작업은 경계면 외부 구현체로 완결됩니다.</text>
  <rect x="24" y="184" width="952" height="88" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="207" font-size="13" font-weight="600" fill="#c9d1d9">1 · 상위 도메인 시스템 (MES · WMS · SCADA)</text>
  <text x="956" y="207" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1" fill="#8b949e">인바운드 (Inbound)</text>
  <text x="44" y="226" font-size="10.5" fill="#8b949e">Middleware 공개 API — submit · pump · pending · ack · resolve · cancel · release</text>
  <text x="956" y="226" font-size="10" text-anchor="end" fill="#8b949e">picasso · middleware/Middleware.kt</text>
  <text x="44" y="247" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">연동 요구사항</text>
  <text x="112" y="247" font-size="11" fill="#c9d1d9">상위 통신 프로토콜(OPC UA · REST · 메시지 큐)을 중계하는 인바운드 ACL 어댑터 구현</text>
  <text x="44" y="265" font-size="10" font-weight="700" letter-spacing="0.5" fill="#3fb950">불변 영역</text>
  <text x="112" y="265" font-size="11" fill="#3fb950">picasso 코어 전체 — 능력 오케스트레이션 · 상태 엔진 · 포트 계층</text>
  <rect x="24" y="278" width="952" height="88" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="301" font-size="13" font-weight="600" fill="#c9d1d9">2 · 설비 제어 신호 (PLC · WCS)</text>
  <text x="956" y="301" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1" fill="#8b949e">인바운드 (Inbound)</text>
  <text x="44" y="320" font-size="10.5" fill="#8b949e">CellSignals.observe(location): SlotSignal?  —  null은 유효 신호 부재를 의미</text>
  <text x="956" y="320" font-size="10" text-anchor="end" fill="#8b949e">picasso · middleware/Ports.kt</text>
  <text x="44" y="341" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">연동 요구사항</text>
  <text x="112" y="341" font-size="11" fill="#c9d1d9">PLC 태그 또는 무전압 접점 신호를 수집하여 SlotSignal 모델로 변환하는 포트 구현</text>
  <text x="44" y="359" font-size="10" font-weight="700" letter-spacing="0.5" fill="#3fb950">불변 영역</text>
  <text x="112" y="359" font-size="11" fill="#3fb950">시간 윈도우(δ) · 재확인 지연 · UNVERIFIED 판정 등 교차 검증 비즈니스 규칙</text>
  <rect x="24" y="372" width="952" height="88" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="395" font-size="13" font-weight="600" fill="#c9d1d9">3 · AMR 플릿 관리 시스템 (Fleet Manager)</text>
  <text x="956" y="395" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1" fill="#8b949e">아웃바운드 (Outbound)</text>
  <text x="44" y="414" font-size="10.5" fill="#8b949e">AmrFleetPort — dispatch · status · cancel · executionLookup 및 기본 None 구현체</text>
  <text x="956" y="414" font-size="10" text-anchor="end" fill="#8b949e">picasso · middleware/Ports.kt</text>
  <text x="44" y="435" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">연동 요구사항</text>
  <text x="112" y="435" font-size="11" fill="#c9d1d9">벤더 플릿 관리 API를 4대 포트 메서드로 변환 매핑 (DELIVERED는 물리적 화물 인수 상태)</text>
  <text x="44" y="453" font-size="10" font-weight="700" letter-spacing="0.5" fill="#3fb950">불변 영역</text>
  <text x="112" y="453" font-size="11" fill="#3fb950">E1/E2 근거 결합 · 물리 인계 대기 · 취소 후속 정리 오케스트레이션 규칙</text>
  <rect x="24" y="466" width="952" height="88" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="489" font-size="13" font-weight="600" fill="#c9d1d9">4 · 로봇 제어 포트 (소비자 관점)</text>
  <text x="956" y="489" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1" fill="#8b949e">아웃바운드 (Outbound)</text>
  <text x="44" y="508" font-size="10.5" fill="#8b949e">RobotPort — capabilities · start · watch · cancel · snapshot · replay</text>
  <text x="956" y="508" font-size="10" text-anchor="end" fill="#8b949e">picasso · middleware/Ports.kt</text>
  <text x="44" y="529" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">연동 요구사항</text>
  <text x="112" y="529" font-size="11" fill="#c9d1d9">기본 gRPC 통신 클라이언트(ClientRobotPort)가 내장되어 추가 변경 불필요</text>
  <text x="44" y="547" font-size="10" font-weight="700" letter-spacing="0.5" fill="#3fb950">불변 영역</text>
  <text x="112" y="547" font-size="11" fill="#3fb950">오케스트레이션 엔진 및 포트 추상화 전 계층 불변</text>
  <rect x="24" y="560" width="952" height="88" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="583" font-size="13" font-weight="600" fill="#c9d1d9">5 · 로봇 런타임 호스트 (발신자 관점)</text>
  <text x="956" y="583" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1" fill="#8b949e">아웃바운드 (Outbound)</text>
  <text x="44" y="602" font-size="10.5" fill="#8b949e">RobotAdapter — adapter-host와 어댑터 간 표준 계약 인터페이스 (ADR 39)</text>
  <text x="956" y="602" font-size="10" text-anchor="end" fill="#8b949e">adapter-core · RobotAdapter.kt</text>
  <text x="44" y="623" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">연동 요구사항</text>
  <text x="112" y="623" font-size="11" fill="#c9d1d9">에뮬레이터 대신 adapter-host 프로세스 기동 (소비자는 gRPC 접속 엔드포인트만 변경)</text>
  <text x="44" y="641" font-size="10" font-weight="700" letter-spacing="0.5" fill="#3fb950">불변 영역</text>
  <text x="112" y="641" font-size="11" fill="#3fb950">상위 소비자 코드 전체 — HostParityTest를 통해 에뮬레이터/어댑터 등가성 검증 완료</text>
  <rect x="24" y="654" width="952" height="88" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="677" font-size="13" font-weight="600" fill="#c9d1d9">6 · 벤더 통신 링크 (어댑터 하향 인터페이스)</text>
  <text x="956" y="677" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1" fill="#8b949e">아웃바운드 (Outbound)</text>
  <text x="44" y="696" font-size="10.5" fill="#8b949e">SpotLink · DigitLink · G1Link · OrbitLink — 기종별 전용 모듈 경계 내에 캡슐화</text>
  <text x="956" y="696" font-size="10" text-anchor="end" fill="#8b949e">adapter-&lt;기종&gt; · SpotLink.kt 외 셋</text>
  <text x="44" y="717" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">연동 요구사항</text>
  <text x="112" y="717" font-size="11" fill="#c9d1d9">벤더 전용 SDK/프로토콜을 연동하여 링크 인터페이스 구현 (Orbit은 HTTP 실물 연동 내장)</text>
  <text x="44" y="735" font-size="10" font-weight="700" letter-spacing="0.5" fill="#3fb950">불변 영역</text>
  <text x="112" y="735" font-size="11" fill="#3fb950">표준 계약 · adapter-host · 미들웨어 코어 · 타 기종 어댑터 모듈 전체</text>
  <rect x="24" y="748" width="952" height="88" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="771" font-size="13" font-weight="600" fill="#c9d1d9">7 · 원격 측정 및 상태 발행 (MQTT Uplink)</text>
  <text x="956" y="771" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1" fill="#8b949e">아웃바운드 (Outbound)</text>
  <text x="44" y="790" font-size="10.5" fill="#8b949e">Publisher.publish(Publication) — 목적지: NoOp · 메모리 기록 · Eclipse Paho 실물 브로커</text>
  <text x="956" y="790" font-size="10" text-anchor="end" fill="#8b949e">uplink · Publisher.kt</text>
  <text x="44" y="811" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">연동 요구사항</text>
  <text x="112" y="811" font-size="11" fill="#c9d1d9">Paho 클라이언트 구현체 내장 — 대상 브로커 연결 주소 및 접속 정보 설정</text>
  <text x="44" y="829" font-size="10" font-weight="700" letter-spacing="0.5" fill="#3fb950">불변 영역</text>
  <text x="112" y="829" font-size="11" fill="#3fb950">MQTT 토픽 구조 · 메타데이터 헤더 규격 · 재생(Replay) 버퍼 및 세션 관리 규칙</text>
  <rect x="24" y="842" width="952" height="88" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="865" font-size="13" font-weight="600" fill="#c9d1d9">8 · 감사 원장 및 상태 보고 (HTTP Uplink)</text>
  <text x="956" y="865" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1" fill="#8b949e">아웃바운드 (Outbound)</text>
  <text x="44" y="884" font-size="10.5" fill="#8b949e">HandshakeReporter · TaskObservations · LivenessObservations · RobotDiscovery</text>
  <text x="956" y="884" font-size="10" text-anchor="end" fill="#8b949e">uplink · report/</text>
  <text x="44" y="905" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">연동 요구사항</text>
  <text x="112" y="905" font-size="11" fill="#c9d1d9">HTTP 전송 구현체 내장 — 레지스트리 URL 및 인증 토큰 구성 (실패 시 로컬 파일 폴백)</text>
  <text x="44" y="923" font-size="10" font-weight="700" letter-spacing="0.5" fill="#3fb950">불변 영역</text>
  <text x="112" y="923" font-size="11" fill="#3fb950">원격 측정 관측 스키마 및 FailedObservations 격리/재시도 폴백 정책</text>
  <rect x="24" y="936" width="952" height="88" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="959" font-size="13" font-weight="600" fill="#c9d1d9">9 · 기체 프로파일 공급원 (Profile Source)</text>
  <text x="956" y="959" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1" fill="#8b949e">인바운드 (Inbound)</text>
  <text x="44" y="978" font-size="10.5" fill="#8b949e">ProfileSource.load(path) · RegistrySource.binding(robotId)</text>
  <text x="956" y="978" font-size="10" text-anchor="end" fill="#8b949e">mimic · ProfileSource.kt · RegistrySource.kt</text>
  <text x="44" y="999" font-size="10" font-weight="700" letter-spacing="0.5" fill="#8b949e">연동 요구사항</text>
  <text x="112" y="999" font-size="11" fill="#c9d1d9">로컬 JSON 및 원격 레지스트리 소스 내장 — 부트스트랩 구성에서 공급자 선택</text>
  <text x="44" y="1017" font-size="10" font-weight="700" letter-spacing="0.5" fill="#3fb950">불변 영역</text>
  <text x="112" y="1017" font-size="11" fill="#3fb950">가상화 실행 엔진 코어 — 풀 기반 프로파일 로드 구조 준수</text>
  <rect x="24" y="1036" width="952" height="54" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="44" y="1058" font-size="11" fill="#8b949e">포트 계약은 메인 소스에 정의되고 테스트 대역은 테스트 스위트에 위치 — 대역 코드 제거 시에도 코어 빌드 무결성 유지</text>
  <text x="44" y="1077" font-size="11" fill="#8b949e">표시된 소스 경로는 docs/seams.md 명세와 일치하며, DocumentClaimsTest를 통해 심볼 실재성이 자동 검증됨</text>
</svg>
