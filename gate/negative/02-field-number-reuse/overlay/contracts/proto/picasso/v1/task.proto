syntax = "proto3";

package picasso.v1;

option java_multiple_files = true;
option java_package = "dev.picasso.contracts.v1";

import "picasso/v1/common.proto";
import "picasso/v1/fault.proto";

// 설계 §4.4. RETRIABLE을 종착으로 두지 않는 것이 요점이다 —
// 재시도 가능한 실패는 에러 코드가 아니라 상태다(VDA5050 actionStatus).
//
// 종착은 SUCCEEDED / FAILED / CANCELLED / CANCELLED_RECOVERY_FAILED 넷이고
// **종착은 래치된다**. 실물 중에는 이를 지키지 않는 것이 있으므로
// (Agility Digit 매뉴얼: "This status does not latch once reached")
// 그런 로봇에서는 어댑터가 래치 책임을 지고, 위반을 관측하면
// TERMINAL_STATE_VIOLATED 결함을 발행한다.
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_ACCEPTED = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_PAUSED = 3;

  // 취소 요청을 받고 하던 일을 안전하게 되돌리는 중.
  // 휴머노이드는 들고 있던 것을 내려놔야 하므로 즉시 중단이 물리적으로 불가능하다.
  TASK_STATE_CANCELLING = 4;

  // 실패했으나 로봇 혼자 재시도하면 될 수 있음. RetryTask를 기다린다.
  TASK_STATE_RETRIABLE = 5;

  // 실패했고 사람이 무언가 해야 재시도가 의미 있음. 역시 RetryTask를 기다린다.
  // 자동 재시도를 걸면 같은 실패를 반복하며 자원만 태우므로 5와 나눈다.
  TASK_STATE_NEEDS_INTERVENTION = 6;

  TASK_STATE_SUCCEEDED = 7;
  TASK_STATE_FAILED = 8;

  // 취소하고 복구까지 마쳤다.
  TASK_STATE_CANCELLED = 9;

  // 취소했으나 복구에 실패했다 — 로봇이 물건을 든 채 멈춰 있는 상황이다.
  // 9와 전혀 다른 운영 상황이라 나눈다. Agility Arc도 워크플로 상태에
  // CANCELED_WITH_RECOVERY / _RUNNING_RECOVERY / _FAILED_RECOVERY 세 변종을 둔다.
  TASK_STATE_CANCELLED_RECOVERY_FAILED = 10;
}

// 파라미터 하나의 값. ENUM형도 문자열로 싣는다 —
// 허용 값 검사는 프로파일이 하지 계약이 하지 않는다.
message ParameterValue {
  string key = 1;

  oneof value {
    bool bool_value = 2;
    int64 integer_value = 3;
    double number_value = 4;
    string string_value = 5;
  }
}

// 멱등성 키는 (task_id, revision) 단조쌍이다.
// VDA5050의 (orderId, orderUpdateId)를 그대로 가져왔다.
message TaskHandle {
  int64 task_id = 1;
  uint32 revision = 2;
  string robot_id = 3;
}

message StartTaskRequest {
  MessageHeader header = 1;

  string task_id = 2;
  uint32 revision = 3;
  string robot_id = 4;

  string skill_type = 5;
  repeated ParameterValue parameters = 6;
}

message StartTaskResponse {
  MessageHeader header = 1;

  // 접수 응답이지 종착이 아니다. 종착은 WatchTask 스트림으로 온다.
  oneof result {
    TaskHandle handle = 2;
    Rejection rejection = 3;
  }
}

message WatchTaskRequest {
  MessageHeader header = 1;
  TaskHandle handle = 2;

  // 재접속 시 이어받을 지점. 태스크 단위 카운터이며
  // MQTT의 sequence와 다른 축이다(설계 §3.5).
  uint64 from_update_index = 3;
}

// 잔여 물리 상태 — 이 갱신 시점에 로봇이 **무엇을 들고 있는가**.
//
// 설계 §4.4. `CANCELLED`와 `CANCELLED_RECOVERY_FAILED`를 나눈 이유가
// *"로봇이 물건을 든 채 멈춰 있다"*였는데, 그 사실 자체를 실을 자리가
// 없었다 — `partial_result` 자유 문자열뿐이었다(§15.84 후보 ②).
//
// 값이 넷인 이유는 `Support`가 3값인 이유와 같다 — "빈손"과 "볼 수 없다"를
// 접으면 발신자가 거짓말을 하게 된다. 발신자마다 근거가 다르다:
//   Spot  — `ManipulatorState.is_gripper_holding_item`(벤더가 판정을 준다)
//   Digit — 파지 상태를 직접 발행하지 않는다. `get-execution-state`의
//           노드 상태(`action-pick` 성공 ∧ `action-place` 미완)에서 추론한다
//   G1    — 벤더가 판정을 안 준다. `HandState_.press_sensor_state`는 원시
//           압력값이고 문턱을 우리가 정하면 그것은 벤더의 답이 아니다
//   mimic — 대상을 쥐는 스킬(`grasps_object`)이 도는 동안 HOLDING. 참조만 하는
//           스킬(`inspect`)은 빈손이다
//
// **불변식 하나.** `CANCELLED`(복구까지 마쳤다)와 함께 `HOLD_KIND_HOLDING`이
// 올 수 없다. 들고 있으면 복구가 끝난 것이 아니고, 그것은
// `CANCELLED_RECOVERY_FAILED`다. 역은 성립하지 않는다 — 복구 실패가 언제나
// 들고 있음은 아니다(놓쳤을 수 있고, 그때는 `PAYLOAD_LOST`가 같이 선다).
enum HoldKind {
  // 발신자가 말하지 않았다 — 이 필드가 생기기 전의 발신자다.
  HOLD_KIND_UNSPECIFIED = 0;

  // 발신자가 **볼 수 없다** — 벤더가 파지 판정을 안 주거나 읽기가 실패했다.
  // `HoldState.reason`에 이유가 실린다. 빈손이 아니다.
  HOLD_KIND_NOT_OBSERVABLE = 1;

  HOLD_KIND_EMPTY = 2;
  HOLD_KIND_HOLDING = 3;
}

message HoldState {
  HoldKind kind = 1;

  // HOLDING이고 그것이 이 태스크의 대상이면 그 **이름** —
  // `is_object_reference` 파라미터의 값이다. 이름 공간이지 벤더 id가
  // 아니다(§15.78). 들고 있는데 무엇인지 모르면 비운다.
  string object_ref = 2;

  // NOT_OBSERVABLE의 이유. 사람이 읽는다.
  string reason = 3;
}

// 진행률의 **근거** — `WatchTaskResponse.progress` 의 숫자가 무엇을 센 것인가.
//
// 값을 두 곳에 두지 않는다: 분수는 `progress` 하나이고 이것은 그 분수를 **자격 짓는다**
// (`HoldState.kind`가 `object_ref`를 자격 짓는 것과 같은 모양).
//
// 이것이 없으면 **못 재는 기체와 아직 아무것도 안 한 기체가 `0.0` 으로 같아 보인다.**
// 진행 정체로 개입을 판단하는 소비자에게 그 둘은 정반대다 — 앞은 판정할 근거가 없는
// 것이고 뒤는 판정해야 할 것이다. 접으면 진행률을 안 내는 기종이 **언제나 멈춰 있는
// 것으로** 보인다(설계 §15.112).
enum ProgressKind {
  // 옛 발신자. `progress`의 뜻을 모른다 — **측정된 것으로 읽지 않는다.**
  PROGRESS_KIND_UNSPECIFIED = 0;

  // 이 기체·이 스킬은 진행률을 낼 근거가 없다. `progress`의 0.0은 값이 아니다.
  PROGRESS_KIND_NOT_OBSERVABLE = 1;

  // `progress`가 유효하다. 무엇을 세었는지는 `basis`가 말한다.
  PROGRESS_KIND_MEASURED = 2;
}

message ProgressBasis {
  ProgressKind kind = 1;

  // 무엇을 세었는가. 사람이 읽는다 — "행동 3/7", "실행 트리 잎 1/2", "경과 시간 비율".
  // 기종마다 세는 단위가 다르다는 사실을 숨기지 않으려는 것이다.
  string basis = 2;

  // NOT_OBSERVABLE의 이유. 사람이 읽는다.
  string reason = 3;
}

message WatchTaskResponse {
  MessageHeader header = 1;

  TaskState state = 2;
  uint32 revision = 3;

  // RetryTask가 revision을 바꾸지 않으므로 attempt가 재시작을 구분한다.
  uint32 attempt = 4;

  // 0.0..1.0. 단조 비감소는 (task_id, revision, attempt)가 같은 구간
  // 안에서만 성립하는 불변식이다.
  //
  // **이 숫자만으로는 부족하다** — 아래 progress_basis가 그것이 측정된
  // 값인지 말한다(0.8.0).
  double progress = 5;

  string partial_result = 6;

  // 종착이 실패인 경우에만 채워진다.
  Fault fault = 7;

  // 이 갱신 시점의 잔여 물리 상태. **종착 갱신의 것이 취소·실패 뒤의
  // 잔여 상태다.** 위 HoldState 의 불변식이 여기 걸린다.
  HoldState hold = 8;

  // 위 progress가 무엇을 센 것인가(0.8.0). 비우면 UNSPECIFIED이고,
  // 소비자는 그것을 "측정되지 않았다"로 읽는다 — 막는 방향이다(§15.41).
  ProgressBasis progress_basis = 9;
}

message RetryTaskRequest {
  MessageHeader header = 1;
  TaskHandle handle = 2;
}

// 아래 넷은 응답 형태가 같다 — oneof로 "받아들여진 뒤의 상태" 또는 "거절 사유".
// 표면마다 bool/state/oneof를 섞으면 소비자가 RPC마다 다른 분기를 쓰게 된다.

message RetryTaskResponse {
  MessageHeader header = 1;

  oneof result {
    // 받아들여지면 RUNNING. attempt가 오른다.
    TaskState state = 2;

    // RETRIABLE / NEEDS_INTERVENTION이 아닌 상태에서 부르면 INVALID_TRANSITION.
    Rejection rejection = 3;
  }
}

message PauseTaskRequest {
  MessageHeader header = 1;
  TaskHandle handle = 2;
}

message PauseTaskResponse {
  MessageHeader header = 1;

  oneof result {
    // 받아들여지면 PAUSED.
    TaskState state = 2;

    // pause_support=NO인 스킬이면 PAUSE_UNSUPPORTED.
    // UNKNOWN이면 시도가 허용되되 로봇이 거절할 수 있다.
    Rejection rejection = 3;
  }
}

message ResumeTaskRequest {
  MessageHeader header = 1;
  TaskHandle handle = 2;
}

message ResumeTaskResponse {
  MessageHeader header = 1;

  oneof result {
    // 받아들여지면 RUNNING.
    TaskState state = 2;
    Rejection rejection = 3;
  }
}

message CancelTaskRequest {
  MessageHeader header = 1;
  TaskHandle handle = 2;
}

message CancelTaskResponse {
  MessageHeader header = 1;

  oneof result {
    // 취소는 즉시가 아니고 복구를 동반한다. 여기서 CANCELLING을 돌려주고
    // 종착(CANCELLED 또는 CANCELLED_RECOVERY_FAILED)은 WatchTask 스트림으로 온다.
    // openTCS TransportOrder.State의 WITHDRAWN과 같은 구조다.
    TaskState state = 2;

    // cancel_support=NO인 스킬이면 CANCEL_UNSUPPORTED.
    Rejection rejection = 3;
  }
}

service TaskService {
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse);
  rpc WatchTask(WatchTaskRequest) returns (stream WatchTaskResponse);
  rpc RetryTask(RetryTaskRequest) returns (RetryTaskResponse);
  rpc PauseTask(PauseTaskRequest) returns (PauseTaskResponse);
  rpc ResumeTask(ResumeTaskRequest) returns (ResumeTaskResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}
