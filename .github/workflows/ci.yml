name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 게이트 2·6번이 베이스와 diff하므로 전체 이력이 필요하다

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 게이트가 --require 에 CONTRACT_DESCRIPTOR 를 넣으므로 먼저 만들어야 한다.
      # **디스크립터는 이제 protoc 이 만든다** — 런타임 신원(picasso.desc)과 게이트가
      # 읽는 것이 같은 파일이고, `:gate:test` 는 Gradle 태스크 의존으로 그것을 본다
      # (§15.111). 여기서는 게이트 **CLI** 가 쓸 것을 미리 만들어 둔다.
      - name: 계약 디스크립터
        run: ./gradlew :contracts:generateProto -q

      - name: 기준선 준비
        id: baseline
        run: |
          set -o pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            echo "push 빌드라 기준선이 없다 — 파괴 검사 2·6번은 건너뛴다"
            exit 0
          fi

          # 베이스에 contracts/ 가 없으면(계약 최초 도입 PR) 넘기지 않는다.
          # 넘기면 buf가 "had no .proto files"로 거짓 실패를 낸다(실측).
          if git cat-file -e "$BASE:contracts/buf.yaml" 2>/dev/null; then
            echo "contract=../.git#ref=$BASE,subdir=contracts" >> "$GITHUB_OUTPUT"
          fi

          # **기준선 쪽에서 열거한다.** head 파일 목록을 돌면 삭제된 프로파일이
          # 맵에 안 들어와 검사 6번의 삭제 판정이 영영 발화하지 않는다.
          #
          # git ls-tree는 pathspec 글로브를 기본으로 먹지 않는다(실측 —
          # `-- 'profile/fixtures/*.json'` 이 빈 목록을 냈고, 빈 기준선으로
          # 검사 6이 모든 프로파일을 신규로 보고 PASS를 냈다). 디렉터리로 주고
          # grep으로 거른다.
          #
          # 파이프라인 안에서 열거하면 git 실패가 while의 종료코드 0에 묻히므로
          # 목록을 먼저 파일로 뽑는다.
          #
          # **두 디렉터리 모두에서 뽑는다.** 픽스처만 뽑으면 실제 기종
          # 프로파일이 영원히 "신규"로 분류되어 검사 6의 축소 판정이
          # 발화하지 않는다.
          git ls-tree -r --name-only "$BASE" profile/fixtures/ profile/profiles/ \
            | grep '\.json$' > /tmp/baseline-list || true
          mkdir -p /tmp/baseline-fixtures /tmp/baseline-profiles
          while read -r f; do
            case "$f" in
              profile/fixtures/*) out=/tmp/baseline-fixtures ;;
              *)                  out=/tmp/baseline-profiles ;;
            esac
            git show "$BASE:$f" > "$out/$(basename "$f")"
          done < /tmp/baseline-list

          # 빈 기준선과 "기준선 못 얻음"을 CI가 구분해 줘야 검사 6이 뜻대로 돈다.
          if [ -s /tmp/baseline-list ]; then
            echo "profiles=yes" >> "$GITHUB_OUTPUT"
          fi

          # 검사 8번의 입력. **추가와 전체를 따로 뽑는다** — git diff --name-only
          # 는 상태 문자를 주지 않아 추가와 수정을 구별할 수 없고, 검사 8은
          # 추가일 때만 발화한다.
          #
          # --no-renames 가 값을 한다: 이름 바꾸기 탐지를 켜 두면
          # `git mv humanoid-a.json humanoid-c.json` 이 경로 하나로 보고되어
          # "소스 변경 0으로 새 기종이 들어왔다"로 읽힌다.
          #
          # **실패를 빈 목록으로 접지 않는다.** 빈 목록은 "이 변경은 아무것도
          # 안 바꿨다"이고, 그것은 "diff를 못 만들었다"와 다른 주장이다.
          git diff --name-only "$BASE...HEAD" > /tmp/changed-files
          git diff --name-only --diff-filter=A --no-renames "$BASE...HEAD" > /tmp/added-files
          echo "diff=yes" >> "$GITHUB_OUTPUT"

      - name: 게이트
        run: |
          ./gradlew :gate:installDist -q
          # **두 디렉터리를 명시한다.** §7.4가 픽스처와 실제 기종을 나눠
          # 두는데, 하나만 넘기면 나머지가 검사 3·4·6 밖에 놓이고 완료
          # 기준 9가 아무 근거 없이 참이 된다.
          ARGS="--repo . --buf $PWD/tools/buf"
          ARGS="$ARGS --profiles profile/fixtures --profiles profile/profiles"
          # **--require 는 한 번만 준다.** 두 번 주면 clikt가 뒤엣것으로
          # 덮어써서 앞의 요구가 통째로 사라진다.
          REQUIRE="REPO,PROFILE_DOCUMENT,PROFILE_SCHEMA,CONTRACT_DESCRIPTOR,BUF"
          if [ -n "${{ steps.baseline.outputs.contract }}" ]; then
            ARGS="$ARGS --contract-baseline '${{ steps.baseline.outputs.contract }}'"
          fi
          if [ -n "${{ steps.baseline.outputs.profiles }}" ]; then
            ARGS="$ARGS --baseline-dir /tmp/baseline-fixtures --baseline-dir /tmp/baseline-profiles"
          fi
          # PR 빌드에서는 검사 8번을 **요구한다.** 요구 목록에 없으면 diff
          # 생성이 어느 날 조용히 깨져도 SKIP으로 넘어가고, 완료 기준 11의
          # 기제가 아무 소리 없이 사라진다.
          if [ -n "${{ steps.baseline.outputs.diff }}" ]; then
            ARGS="$ARGS --changed-files-from /tmp/changed-files --added-files-from /tmp/added-files"
            REQUIRE="$REQUIRE,CHANGED_FILES"
          fi
          ARGS="$ARGS --require $REQUIRE"
          eval "./gate/build/install/gate/bin/gate $ARGS"

      # 음성 하네스를 별도 스텝으로 두면 뒤이은 build가 시스템 프로퍼티 없이
      # 다시 돌아 마지막 실행 상태가 비-strict가 된다(Test.systemProperties가
      # 태스크 입력이라 UP-TO-DATE가 안 걸린다). 한 번만 돌린다.
      - name: Build (음성 하네스 포함)
        run: >
          ./gradlew build
          -Dpicasso.negative.strict=true
          -Dpicasso.buf="$PWD/tools/buf"
