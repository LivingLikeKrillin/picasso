name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 게이트 2·6번이 기본 브랜치와 diff하므로 전체 이력이 필요하다

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: buf lint
        run: cd contracts && ../tools/buf lint

      # --against . 은 자기 자신과 비교하므로 실패할 수 없다.
      # 회귀 방어가 아니라 buf.yaml의 breaking: 절이 파싱되는지 보는 것이다.
      # 진짜 회귀 방어는 게이트 검사 2번이 기본 브랜치를 기준선으로 삼을 때 생긴다.
      - name: buf breaking (config self-check)
        run: cd contracts && ../tools/buf breaking --against .

      - name: buf build (descriptor)
        run: |
          mkdir -p contracts/build
          cd contracts && ../tools/buf build -o build/descriptor.binpb

      - name: Build
        run: ./gradlew build
