# §3.4 — MVC + 가상 스레드. WebFlux는 쓰지 않는다.
#
# 가상 스레드를 켜는 이유는 처리량이 아니라 **모양**이다. 진단은 DB를 기다리는
# 블로킹 호출이고, 그것을 논블로킹으로 바꾸면 도메인이 리액티브 타입을 알게
# 된다 — §3.4의 "도메인 로직은 프레임워크를 모른다"가 그 자리에서 깨진다.
spring.threads.virtual.enabled=true

spring.application.name=picasso-registry

# 값은 배포가 준다. 여기 기본값을 적으면 그것이 조용히 운영에 쓰인다.
picasso.db.url=${PICASSO_DB_URL:}
picasso.db.user=${PICASSO_DB_USER:}
picasso.db.password=${PICASSO_DB_PASSWORD:}

# §11.1의 게이트 입력. 없으면 검증이 Incomplete가 된다 — **통과가 아니다.**
picasso.profile.schema=${PICASSO_PROFILE_SCHEMA:}
